# sample config file
server:
  listenAddr: 0.0.0.0:3000
  # listenAddr: 127.0.0.1:${SERVER_PORT}  # supports for env vars expansion

db:
  type: sqlite
  url: ibc.db
  # type: postgres
  # url: postgres://user:password@host:port/dbname

observability:
  metrics: true
  type: simple
  simpleMetricsListenAddr: 127.0.0.1:9090

# chains declares chain information shared by the attestor and relayer;
# referenced by other blocks via chainId
chains:
  - chainId: "1"
    evm:
      rpc: https://ethereum-rpc.example.com
      # ws is required by any client end that enables autoRelay
      ws: wss://ethereum-rpc.example.com
      ics26Router: "0x0000000000000000000000000000000000000001"
      ibcMulticall: "0x0000000000000000000000000000000000000002"
  - chainId: "8453"
    evm:
      rpc: https://base-rpc.example.com
      ws: wss://base-rpc.example.com
      ics26Router: "0x0000000000000000000000000000000000000001"
      ibcMulticall: "0x0000000000000000000000000000000000000002"

relayer:
  # relay specific chain settings
  chainOverrides:
    - chainId: "1"
      packetBatchSize: 50

  # each connection is relayed bidirectionally: clientA's counterparty is
  # simply clientB, and vice versa
  connections:
    - alias: "eth-base"
      clientA:
        chainId: "1"
        signer: "eth-relayer-key"
        clientId: "base-0"
        type: "attestation"
        autoRelay:
          enabled: true
      clientB:
        chainId: "8453"
        signer: "base-relayer-key"
        clientId: "ethereum-0"
        type: "attestation"
        autoRelay:
          enabled: true

    # remoteProver delegates proof generation to a ProverService over gRPC
    # instead of the built-in prover. With it, type may name a light client the
    # IBC CLI does not implement.
    - alias: "eth-base-op"
      clientA:
        chainId: "1"
        signer: "eth-relayer-key"
        clientId: "op-stack-0"
        type: "op-stack"
        remoteProver:
          url: prover.example.com:9090
#          # TLS needs url: https://prover.example.com; tls only customizes it
#          tls:
#            caFile: /etc/ibc/tls/ca.crt
#            certFile: /etc/ibc/tls/client.crt
#            keyFile: /etc/ibc/tls/client.key
      clientB:
        chainId: "8453"
        signer: "base-relayer-key"
        clientId: "ethereum-1"
        type: "attestation"

# attestors -- both the ones this process runs itself (type: local)
#  and the ones it queries over gRPC (type: remote).
attestors:
  - name: "attestor-base"
    type: remote
    grpc: attestor.example.com:3000
#    # TLS needs grpc: https://attestor.example.com; tls only customizes it
#    tls:
#      caFile: /etc/ibc/tls/ca.crt
#      certFile: /etc/ibc/tls/client.crt
#      keyFile: /etc/ibc/tls/client.key
  - name: "attestor-ethereum"
    type: remote
    grpc: attestor.example.com:3000
#  - name: "my-local-attestor"
#    chainId: "1"
#    type: local
#    signer: my-local-signer
#    finalityOffset: 1

# signers define signing backends referenced by attestors and the relayer
#
# NOTE: each signer should have a unique alias
signers:
  - alias: "eth-relayer-key"
    type: remote
    grpc: cosmos-kms.example.com:9090
    remoteKeyId: "eth-relayer-key-id"
#    # TLS needs grpc: https://cosmos-kms.example.com; tls only customizes it
#    tls:
#      caFile: /etc/ibc/tls/ca.crt
#      certFile: /etc/ibc/tls/client.crt
#      keyFile: /etc/ibc/tls/client.key
  - alias: "base-relayer-key"
    type: remote
    grpc: cosmos-kms.example.com:9090
    remoteKeyId: "base-relayer-key-id"
#   - alias: my-local-signer
#     type: local
#     file: keys/my-key.json
