# observability.type: simple — IBC exposes /metrics on :9090; collector scrapes it below.
# With type: otel, IBC pushes OTLP to :4318 instead — drop the prometheus/collector job then.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus/collector:
    config:
      scrape_configs:
        - job_name: ibc
          static_configs:
            - targets: ["127.0.0.1:9090"]
          metrics_path: /metrics

processors:
  batch:

exporters:
  otlp_http/metrics:
    endpoint: http://127.0.0.1:9091/api/v1/otlp
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [otlp, prometheus/collector]
      processors: [batch]
      exporters: [otlp_http/metrics]
