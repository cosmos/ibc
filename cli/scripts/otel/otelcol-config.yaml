# SPDX-License-Identifier: Apache-2.0

# Supports both IBC observability modes:
# - simple: scrape http://127.0.0.1:9090/metrics
# - otel: receive OTLP on :4317 or :4318
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus/ibc:
    config:
      scrape_configs:
        - job_name: ibc
          static_configs:
            - targets: ["127.0.0.1:9090"]
          metrics_path: /metrics

processors:
  batch:

exporters:
  otlp_http/metrics:
    endpoint: http://127.0.0.1:9091/api/v1/otlp
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [otlp, prometheus/ibc]
      processors: [batch]
      exporters: [otlp_http/metrics]
