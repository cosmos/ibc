services:
  grafana-lgtm:
    image: grafana/otel-lgtm:0.35.0
    network_mode: host
    environment:
      GF_SERVER_HTTP_PORT: 3001
      PROMETHEUS_EXTRA_ARGS: "--web.listen-address=:9091"
    volumes:
      - ./otelcol-config.yaml:/otel-lgtm/otelcol-config.yaml:ro
      - ./prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
      - ./grafana-datasources.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/grafana-datasources.yaml:ro
      - ./grafana-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/ibc-dashboards.yaml:ro
      - ./dashboards:/otel-lgtm/ibc-dashboards:ro
    healthcheck:
      disable: true
