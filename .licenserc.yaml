# SPDX-License-Identifier: Apache-2.0

# One section per license, matching CONTRIBUTING.md: code under Apache-2.0,
# specifications under Community-Spec-1.0, documentation under CC-BY-4.0.

header:
  # Code and configuration.
  - license:
      content: "SPDX-License-Identifier: Apache-2.0"
      pattern: 'SPDX-License-Identifier:\s*Apache-2.0'

    paths:
      - "**"

    paths-ignore:
      - ".git/**"
      - "**/node_modules/**"

      # Prose is checked by the specification and documentation sections below.
      # Code under spec/ and docs/ is still checked here: the license follows
      # what a file is, not where it lives.
      - "**/*.md"
      - "**/*.mdx"

      # Images cannot carry a source header.
      - "docs/**/*.png"
      - "docs/**/*.jpg"
      - "docs/**/*.gif"
      - "docs/**/*.webp"

      # Files and generated formats that cannot carry a source header.
      # Full license texts: Apache-2.0 at the root, CC-BY-4.0 in docs/. The
      # Community-Spec-1.0 text is spec/01-community-specification-license-v1.md.
      - "**/LICENSE"
      - "NOTICE"
      - "**/go.sum"
      - "**/*.json"
      - "**/*.json.tmpl"
      - "**/*.jsonc"
      - "**/*.svg"
      - "**/*.pdf"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.excalidraw"
      - "**/*.woff2"
      - "**/bun.lock"
      # Failing inputs Go fuzzing records, which must start with "go test fuzz v1".
      - "**/testdata/fuzz/**"

      # Generated Go without configurable file headers.
      - "cli/internal/store/repository/**"
      - "cli/internal/tests/mocks/**"
      - "cli/internal/service/**/*.mock.go"
      - "gen/go/solidity-abi/*/contract.go"


    comment: never
    license-location-threshold: 80

  # Specifications: the canonical spec/ tree and the pages generated from it.
  - license:
      content: "SPDX-License-Identifier: Community-Spec-1.0"
      pattern: 'SPDX-License-Identifier:\s*Community-Spec-1.0'

    paths:
      - "spec/**/*.md"
      - "docs/ibc/spec/**/*.mdx"

    # Copied verbatim from github.com/CommunitySpecification/Community_Specification.
    # 02 to 07 are filled in here and carry the header.
    paths-ignore:
      - "spec/00-contributor-license-agreement.md"
      - "spec/01-community-specification-license-v1.md"
      - "spec/08-code-of-conduct.md"

    comment: never
    # Line 1, or line 2 inside YAML frontmatter, which GitHub and Mintlify
    # require to open the file.
    license-location-threshold: 80

  # Documentation: every other Markdown and MDX page.
  - license:
      content: "SPDX-License-Identifier: CC-BY-4.0"
      pattern: 'SPDX-License-Identifier:\s*CC-BY-4.0'

    paths:
      - "**/*.md"
      - "**/*.mdx"

    paths-ignore:
      - ".git/**"
      - "**/node_modules/**"
      - "spec/**"
      - "docs/ibc/spec/**"

    comment: never
    # Line 1, or line 2 inside YAML frontmatter, which GitHub and Mintlify
    # require to open the file.
    license-location-threshold: 80
