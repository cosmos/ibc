version: 2
updates:
  - package-ecosystem: github-actions
    # The shared release actions pin actions too; "/" alone only covers .github/workflows.
    directories:
      - "/"
      - "/.github/actions/*"
    target-branch: main
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directories:
      - "/cli"
      - "/e2e"
      - "/gen/go/solidity-abi"
    target-branch: main
    schedule:
      interval: weekly
