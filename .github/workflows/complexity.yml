# SPDX-License-Identifier: Apache-2.0

name: Complexity

# Fails when a pull request adds a Go function above the complexity thresholds in
# .golangci.yml, or changes the score of a legacy function in .complexity-baseline.tsv
# without recording it there. It runs on every pull request so that "Complexity"
# can be a required check.
on:
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  complexity:
    name: Complexity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: |
            cli/go.sum
            e2e/go.sum
            gen/go/solidity-abi/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.2
          install-only: true
      - name: Check complexity
        run: make complexity
