# SPDX-License-Identifier: Apache-2.0

name: IBC CLI Build Artifacts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "gen/go/solidity-abi/**"
      - ".github/workflows/ibc-cli-*.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

defaults:
  run:
    shell: bash

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  BUILD_SHA: ${{ github.sha }}
  GO_BUILD_FLAGS: -trimpath -ldflags="-s -w"

jobs:
  # Prepare Docker metadata
  image-metadata:
    name: Prepare Docker metadata
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Select image tag
        id: tag
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            echo "::error::Release images are published by release.yml"
            exit 1
          fi
          # The only triggers are pushes to main and workflow_dispatch, so the ref is a branch here.
          tag=$(printf '%s' "$REF_NAME" | tr '[:upper:]/' '[:lower:]-' | tr -c '[:alnum:]_.-' '-')
          echo "image_tag=${tag:0:128}" >> "$GITHUB_OUTPUT"

  # Build binaries, and publish a Docker image for each linux platform
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: [image-metadata]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            artifact: ibc-darwin-arm64
            runner: ubuntu-latest
          - goos: linux
            goarch: amd64
            artifact: ibc-linux-amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            artifact: ibc-linux-arm64
            runner: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.BUILD_SHA }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: |
            cli/go.sum
            gen/go/solidity-abi/go.sum
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p "dist/${{ matrix.artifact }}"
          go build ${{ env.GO_BUILD_FLAGS }} -o "dist/${{ matrix.artifact }}/ibc" ./cmd/ibc/...
          cp ../LICENSE ../NOTICE "dist/${{ matrix.artifact }}/"
      - name: Checksum
        run: |
          cd "dist/${{ matrix.artifact }}"
          shasum -a 256 ibc > ibc.sha256
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: cli/dist/${{ matrix.artifact }}
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        if: matrix.goos == 'linux'
      - name: Log in to GHCR
        if: matrix.goos == 'linux'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push image
        if: matrix.goos == 'linux'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: cli/dist/${{ matrix.artifact }}
          file: cli/Dockerfile
          target: target-artifact
          platforms: linux/${{ matrix.goarch }}
          push: true
          # Disable BuildKit's unsigned attestation, so the pushed digest is the platform image
          # itself rather than an index wrapping it.
          provenance: false
          tags: ${{ env.IMAGE_NAME }}:${{ needs.image-metadata.outputs.image_tag }}-linux-${{ matrix.goarch }}

  # Publish multi-platform image, so the same tag can be used for various architectures
  publish-manifest:
    name: Publish multi-platform image
    needs: [image-metadata, build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    timeout-minutes: 10
    env:
      IMAGE_TAG: ${{ needs.image-metadata.outputs.image_tag }}
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish manifest
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${IMAGE_TAG}" \
            "${IMAGE_NAME}:${IMAGE_TAG}-linux-amd64" \
            "${IMAGE_NAME}:${IMAGE_TAG}-linux-arm64"
          docker buildx imagetools inspect "${IMAGE_NAME}:${IMAGE_TAG}"
