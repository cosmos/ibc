# SPDX-License-Identifier: Apache-2.0

name: Capslock Capability Diff

# Guards against malicious dependency releases: fails when a pull request changes a
# dependency and code reached through it gains a capability such as EXEC, NETWORK or
# FILES. It runs on every pull request so that "Capslock" can be a required check; one
# that changes no dependency stops after comparing the module lists.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

# Same values as capslock.yml. The version and cgo setting are part of the artifact name, and
# any module missing from it is analysed from the base commit, so a mismatch costs time only.
env:
  CAPSLOCK_VERSION: v0.3.3
  CAPSLOCK_MODULES: cli e2e
  # How cli is released; cgo also widens what a dependency can do unseen.
  CGO_ENABLED: "0"

jobs:
  diff:
    name: Capslock
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      # Main's baseline artifact.
      actions: read
    steps:
      # The merge commit and its first parent, the main commit it merges onto.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: |
            cli/go.sum
            e2e/go.sum
            gen/go/solidity-abi/go.sum

      - name: Find changed dependencies
        id: deps
        run: |
          set -euo pipefail
          base="$(git rev-parse 'HEAD^1')"
          git worktree add -q --detach "$RUNNER_TEMP/base" "$base"

          # The build list as go resolves it, one "path<TAB>version or replace" line per
          # module. -mod=readonly lets go compute it even when vendor/ exists.
          list() {
            (cd "$1" && go list -mod=readonly -m -f '{{.Path}}{{"\t"}}{{if .Main}}main{{else}}{{.Version}}{{with .Replace}} => {{.Path}}{{with .Version}} {{.}}{{end}}{{end}}{{end}}' all) | sort
          }

          # capslock-out/<module>-modules.tsv: path, status, base, head. A module is changed
          # when added, bumped, or given a new replace or go.work use, local ones included;
          # a changed vendor/ tree marks them all, since it is what gets built.
          mkdir -p capslock-out
          modules=""
          for m in $CAPSLOCK_MODULES; do
            # Captured first, so that a failing go list fails the step rather than passing it.
            old="$(list "$RUNNER_TEMP/base/$m")"
            new="$(list "$m")"
            vendor=0
            if [ -e "$m/vendor" ] || [ -e "$RUNNER_TEMP/base/$m/vendor" ]; then
              diff -rq "$RUNNER_TEMP/base/$m/vendor" "$m/vendor" >/dev/null 2>&1 || vendor=1
            fi
            join -t $'\t' -a 1 -a 2 -e '' -o 0,1.2,2.2 <(printf '%s\n' "$old") <(printf '%s\n' "$new") \
              | awk -F '\t' -v OFS='\t' -v vendor="$vendor" '{
                  if ($3 == "") s = "removed"
                  else if ($3 == "main" && ($2 == "main" || $2 == "")) s = "unchanged"
                  else s = (vendor || $2 != $3) ? "changed" : "unchanged"
                  print $1, s, $2, $3
                }' > "capslock-out/$m-modules.tsv"
            if cut -f2 "capslock-out/$m-modules.tsv" | grep -qx changed; then modules="$modules $m"; fi
          done
          # A change to the gate itself runs it in full, so that it is tested before it guards main.
          if ! git diff --quiet 'HEAD^1' HEAD -- .github/workflows/capslock.yml .github/workflows/capslock-diff.yml \
            scripts/capslock-classify.sh; then
            modules="$CAPSLOCK_MODULES"
            echo "The gate itself changed; analysing every module."
          fi
          echo "Base $base. Modules with changed dependencies:${modules:- none}"
          printf 'base=%s\nmodules=%s\n' "$base" "${modules# }" >> "$GITHUB_OUTPUT"

      - name: Install Capslock
        if: steps.deps.outputs.modules != ''
        run: go install github.com/google/capslock/cmd/capslock@"$CAPSLOCK_VERSION"

      # Main's baseline for the base commit, waiting for its run if main only just moved.
      # Analysing the base commit here is the fallback, and the comment says so.
      - name: Fetch baseline
        id: baseline
        if: steps.deps.outputs.modules != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.deps.outputs.base }}
          MODULES: ${{ steps.deps.outputs.modules }}
          NAME: capslock-baseline-${{ env.CAPSLOCK_VERSION }}-cgo${{ env.CGO_ENABLED }}
        run: |
          set -euo pipefail
          source="baseline from main"
          if run="$(gh run list --workflow capslock.yml --branch main --commit "$BASE" --limit 5 \
                --json databaseId,conclusion \
                --jq 'map(select(.conclusion == "" or .conclusion == "success"))[0].databaseId // empty')" \
            && [ -n "$run" ] && gh run watch "$run" --interval 30 >/dev/null \
            && gh run download "$run" --name "$NAME" --dir baseline; then
            source="$source ([run $run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run))"
          fi
          # Whatever the artifact lacks is analysed from the base commit.
          mkdir -p baseline
          built=""
          for m in $MODULES; do
            for g in intermediate function; do
              [ ! -s "baseline/$m-$g.json" ] || continue
              (cd "$RUNNER_TEMP/base/$m" && capslock -packages=./... -granularity="$g" -output=json) \
                > "baseline/$m-$g.json"
              built="$built $m-$g"
            done
          done
          if [ -n "$built" ]; then
            echo "::warning::$NAME from main lacked${built} for $BASE; analysed the base commit here."
            source=":warning: baseline built in this job for${built}"
          fi
          echo "source=$source" >> "$GITHUB_OUTPUT"

      # Intermediate granularity analyses the pull request, so a new dependency only its
      # code imports is covered. Function granularity analyses main's code built against
      # the new dependencies, so the pull request's own new functions are not findings;
      # if main's code does not build against them, the pull request is analysed instead.
      - name: Compare
        id: compare
        if: steps.deps.outputs.modules != ''
        env:
          BASE: ${{ steps.deps.outputs.base }}
          MODULES: ${{ steps.deps.outputs.modules }}
          SOURCE: ${{ steps.baseline.outputs.source }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          deps="$RUNNER_TEMP/deps"
          cp -R "$RUNNER_TEMP/base" "$deps"
          git ls-files -z -- '*go.mod' '*go.sum' go.work go.work.sum | tar --null -T - -cf - | tar -xf - -C "$deps"

          # Exit status 1 means differences were found, 2 or above that capslock failed.
          compare() {
            local status=0
            (cd "$1" && capslock -packages=./... -granularity="$2" -output=compare \
              "$GITHUB_WORKSPACE/baseline/$m-$2.json") > "capslock-out/$m-$2.txt" 2>&1 || status=$?
            return "$status"
          }

          body=capslock-out/comment.md
          printf '<!-- capslock-diff -->\n### Capslock dependency check\n\nBase `%.12s` · %s · [call paths](%s)\n' \
            "$BASE" "$SOURCE" "$RUN_URL" > "$body"
          high=0
          for m in $MODULES; do
            note=""
            compare "$m" intermediate || [ $? -eq 1 ] || { cat "capslock-out/$m-intermediate.txt"; echo "::error::capslock failed on $m"; exit 1; }
            if ! { compare "$deps/$m" function || [ $? -eq 1 ]; }; then
              note="Main's code does not build against the new dependencies, so the function report covers this pull request's code too."
              echo "::warning::$m: $note"
              note="_${note}_"
              compare "$m" function || [ $? -eq 1 ] || { cat "capslock-out/$m-function.txt"; echo "::error::capslock failed on $m"; exit 1; }
            fi
            for g in intermediate function; do
              echo "::group::$m, $g granularity"; cat "capslock-out/$m-$g.txt"; echo "::endgroup::"
            done
            echo >> "$body"
            ./scripts/capslock-classify.sh --name "$m" --modules "capslock-out/$m-modules.tsv" \
              --intermediate "capslock-out/$m-intermediate.txt" --function "capslock-out/$m-function.txt" \
              --counts "capslock-out/$m.counts" >> "$body"
            [ -z "$note" ] || printf '\n%s\n' "$note" >> "$body"
            high=$((high + $(sed -n 's/^high=//p' "capslock-out/$m.counts")))
          done
          cat "$body" >> "$GITHUB_STEP_SUMMARY"
          echo "high=$high" >> "$GITHUB_OUTPUT"

      # Also when an earlier step failed, so a previous comment is never left looking green.
      - name: Comment on the pull request
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          FAILED: ${{ steps.deps.outcome == 'failure' || steps.baseline.outcome == 'failure' || steps.compare.outcome == 'failure' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body=capslock-out/comment.md
          mkdir -p capslock-out
          id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.type == "Bot" and (.body | startswith("<!-- capslock-diff"))) | .id' | tail -n 1)"
          if [ "$FAILED" = true ]; then
            printf '<!-- capslock-diff -->\n### Capslock dependency check\n\n:x: The check could not finish, so dependencies are unchecked. See the [job log](%s).\n' \
              "$RUN_URL" > "$body"
          elif [ ! -s "$body" ]; then
            # No dependency changed: only an earlier comment needs updating, so it is not left stale.
            [ -n "$id" ] || exit 0
            printf '<!-- capslock-diff -->\n### Capslock dependency check\n\n:white_check_mark: No dependency changed.\n' > "$body"
          fi
          if [ -n "$id" ]; then
            jq -n --rawfile body "$body" '{body: $body}' \
              | gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" --input - --silent
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$body"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && steps.deps.outputs.modules != ''
        with:
          name: capslock-diff-${{ github.event.pull_request.number }}
          path: |
            capslock-out/*.txt
            capslock-out/*.tsv
          retention-days: 30
          overwrite: true

      - name: Fail on new capabilities
        if: steps.compare.outputs.high != '' && steps.compare.outputs.high != '0'
        env:
          HIGH: ${{ steps.compare.outputs.high }}
        run: |
          echo "::error::${HIGH} new high-signal capability use(s) through changed dependencies; see the job summary."
          exit 1
