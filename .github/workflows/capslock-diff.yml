# SPDX-License-Identifier: Apache-2.0

name: Capslock Capability Diff

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: read-all

env:
  CAPSLOCK_VERSION: v0.3.3
  CAPSLOCK_FLAGS: -packages=./... -granularity=intermediate

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            go:
              - 'cli/**'
              - 'e2e/**'
              - 'gen/go/solidity-abi/**'
              - '.github/workflows/capslock.yml'
              - '.github/workflows/capslock-diff.yml'

  diff:
    name: Diff ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cli
            dir: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so the baseline can be regenerated from the base commit
          # when no cached baseline is available.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: |
            cli/go.sum
            e2e/go.sum
            gen/go/solidity-abi/go.sum

      - name: Resolve base revision
        id: base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          sha="$BASE_SHA"
          if [ -z "$sha" ]; then
            git fetch --no-tags origin "$BASE_REF"
            sha="$(git rev-parse FETCH_HEAD)"
          fi
          printf 'ref=%s\n' "$BASE_REF" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'slug=%s\n' "$(printf '%s' "$BASE_REF" | tr '/' '-' | tr -c '[:alnum:]_.-' '-')" >> "$GITHUB_OUTPUT"

      - name: Install Capslock
        run: go install github.com/google/capslock/cmd/capslock@"$CAPSLOCK_VERSION"

      # Baselines are published by the "Capslock Capability Baseline" workflow on every
      # push. Prefer the baseline recorded for this PR's base commit, falling back to the
      # most recent baseline for the base branch.
      - name: Restore baseline from cache
        id: baseline-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: capslock-out/${{ matrix.name }}.json
          key: capslock-${{ env.CAPSLOCK_VERSION }}-${{ runner.os }}-${{ matrix.name }}-${{ steps.base.outputs.slug }}-${{ steps.base.outputs.sha }}
          restore-keys: |
            capslock-${{ env.CAPSLOCK_VERSION }}-${{ runner.os }}-${{ matrix.name }}-${{ steps.base.outputs.slug }}-

      - name: Generate baseline from base revision
        if: steps.baseline-cache.outputs.cache-matched-key == ''
        env:
          BASE_REF: ${{ steps.base.outputs.ref }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          NAME: ${{ matrix.name }}
          DIR: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          echo "::notice::No cached Capslock baseline for ${BASE_REF}; generating one from ${BASE_SHA}"
          git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null || git fetch --no-tags origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          mkdir -p "$GITHUB_WORKSPACE/capslock-out"
          cd "$RUNNER_TEMP/base/$DIR"
          capslock $CAPSLOCK_FLAGS -output=json \
            > "$GITHUB_WORKSPACE/capslock-out/${NAME}.json"

      # Exit status 0 means no difference, 1 means a difference was found, and 2 or above
      # means capslock itself failed.
      - name: Compare against baseline
        id: compare
        working-directory: ${{ matrix.dir }}
        env:
          BASELINE: ${{ github.workspace }}/capslock-out/${{ matrix.name }}.json
          REPORT: ${{ github.workspace }}/capslock-out/${{ matrix.name }}-diff.txt
        run: |
          set -uo pipefail
          status=0
          capslock $CAPSLOCK_FLAGS -output=compare "$BASELINE" > "$REPORT" 2>&1 || status=$?
          cat "$REPORT"
          if [ "$status" -ge 2 ]; then
            echo "::error::capslock could not analyze the packages (exit $status)"
            exit 1
          fi
          printf 'added=%s\n' "$(grep -c 'has new capability' "$REPORT" || true)" >> "$GITHUB_OUTPUT"
          printf 'removed=%s\n' "$(grep -c 'no longer has capability' "$REPORT" || true)" >> "$GITHUB_OUTPUT"

      # Builds one markdown body used for both the job summary and the PR comment.
      # The report is truncated because a PR comment body is limited to 65536 characters.
      - name: Build report
        id: report
        if: always() && steps.compare.outcome != 'skipped'
        env:
          REPORT: ${{ github.workspace }}/capslock-out/${{ matrix.name }}-diff.txt
          NAME: ${{ matrix.name }}
          BASE_REF: ${{ steps.base.outputs.ref }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          ADDED: ${{ steps.compare.outputs.added }}
          REMOVED: ${{ steps.compare.outputs.removed }}
          SOURCE: ${{ steps.baseline-cache.outputs.cache-matched-key || 'generated from base revision' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT: capslock-diff-${{ matrix.name }}-pr${{ github.event.pull_request.number || github.run_id }}
        run: |
          set -euo pipefail
          # Empty when the compare step failed before it recorded its outputs.
          ADDED="${ADDED:-}"
          REMOVED="${REMOVED:-}"
          LIMIT=50000
          if [ -f "$REPORT" ]; then size="$(wc -c < "$REPORT" | tr -d '[:space:]')"; else size=0; fi
          body="$RUNNER_TEMP/comment-${NAME}.md"
          {
            printf '<!-- capslock-diff:%s -->\n' "$NAME"
            printf '## Capslock capability diff: `%s`\n\n' "$NAME"
            printf -- '- Base: `%s` (`%s`)\n' "$BASE_REF" "$BASE_SHA"
            printf -- '- Baseline: `%s`\n' "$SOURCE"
            if [ -z "$ADDED" ]; then
              printf -- '- Result: :x: capslock did not complete, see the [job log](%s)\n' "$RUN_URL"
            else
              printf -- '- New capabilities: **%s**\n' "$ADDED"
              printf -- '- Capabilities no longer present: %s\n' "$REMOVED"
            fi
            printf '\n'
            if [ -n "$ADDED" ] && [ "$ADDED" = "0" ] && [ "$REMOVED" = "0" ]; then
              printf ':white_check_mark: No capability changes compared to the baseline.\n'
            else
              printf '<details><summary>Report</summary>\n\n```\n'
              head -c "$LIMIT" "$REPORT" || printf '(report unavailable)\n'
              printf '\n```\n\n</details>\n'
              if [ "$size" -gt "$LIMIT" ]; then
                printf '\nReport truncated (%s of %s bytes shown). Full report: `%s` artifact on the [run](%s).\n' \
                  "$LIMIT" "$size" "$ARTIFACT" "$RUN_URL"
              fi
            fi
          } > "$body"
          cat "$body" >> "$GITHUB_STEP_SUMMARY"
          printf 'body=%s\n' "$body" >> "$GITHUB_OUTPUT"

      # Same-repo PRs only: fork PRs get a read-only GITHUB_TOKEN and cannot be
      # commented on from a pull_request-triggered job. They still get the job
      # summary and the uploaded artifact.
      - name: Post or update PR comment
        if: |
          always() && steps.report.outcome == 'success'
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          MARKER: '<!-- capslock-diff:${{ matrix.name }} -->'
          BODY: ${{ steps.report.outputs.body }}
        run: |
          set -euo pipefail
          # Reuse this job's own previous comment so pushes update in place.
          ids="$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" --paginate \
            --jq '.[] | select(.user.type == "Bot") | select(.body | startswith(env.MARKER)) | .id' || true)"
          id="$(printf '%s' "$ids" | tail -n 1)"
          if [ -n "$id" ]; then
            jq -n --rawfile body "$BODY" '{body: $body}' \
              | gh api --method PATCH "repos/$REPO/issues/comments/$id" --input - --silent
            echo "Updated comment $id"
          else
            gh pr comment "$PR" --repo "$REPO" --body-file "$BODY"
          fi

      - name: Upload diff artifact
        if: always() && steps.compare.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: capslock-diff-${{ matrix.name }}-pr${{ github.event.pull_request.number || github.run_id }}
          path: capslock-out/${{ matrix.name }}-diff.txt
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      # New capabilities are the supply-chain signal worth blocking on. Capabilities that
      # disappeared are reported but do not fail the check, since removing code legitimately
      # drops them.
      - name: Fail on new capabilities
        if: steps.compare.outputs.added != '0'
        env:
          ADDED: ${{ steps.compare.outputs.added }}
          BASE_REF: ${{ steps.base.outputs.ref }}
        run: |
          echo "::error::${ADDED} new capability use(s) introduced relative to ${BASE_REF}; review the job summary"
          exit 1
