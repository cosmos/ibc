# SPDX-License-Identifier: Apache-2.0

name: Capslock Capability Diff

on:
  # Restricted to main because that is the only branch the baseline workflow analyses: a
  # pull request into any other branch would never find a baseline for its base commit.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: read-all

env:
  CAPSLOCK_VERSION: v0.3.3
  CAPSLOCK_FLAGS: -packages=./... -granularity=intermediate
  CAPSLOCK_LOCAL: ${{ vars.CAPSLOCK_LOCAL || format('github.com/{0}/', github.repository) }}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.go }}
      # Defaults to true for workflow_dispatch, where there is no diff to inspect: that is
      # the conservative direction, since it only ever adds findings to the gate.
      deps: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            go:
              - 'cli/**'
              - 'e2e/**'
              - 'gen/go/solidity-abi/**'
              # The Go toolchain looks for go.work in parent directories, so a workspace or
              # vendor tree at the root changes what the modules above build against.
              - 'go.work'
              - 'go.work.sum'
              - 'vendor/**'
              - '.github/workflows/capslock.yml'
              - '.github/workflows/capslock-diff.yml'
              # The classifier decides which findings block, so a change to it has to run
              # the job it governs. Matched as a glob rather than by name so that a script
              # added beside it is covered without this list having to be remembered.
              - 'scripts/capslock-*.sh'
            # Whether this pull request moves the dependency set at all. It decides whether
            # a capability gained by a first-party package can be the pull request's own
            # work or could have come from a dependency -- see the Build report step.
            # Workspace files and vendored sources change what first-party code links
            # against just as a module manifest does.
            deps:
              - '**/go.mod'
              - '**/go.sum'
              - '**/go.work'
              - '**/go.work.sum'
              - '**/vendor/**'

  diff:
    name: Diff ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      # Listing and downloading the baseline artifact published by another workflow run.
      actions: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cli
            dir: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The base commit is resolved from the merge ref's parents, and the
          # workflow_dispatch path fetches the default branch to find its tip.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: |
            cli/go.sum
            e2e/go.sum
            gen/go/solidity-abi/go.sum

      - name: Resolve base revision
        id: base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ]; then
            # workflow_dispatch: compare against the tip of the default branch.
            git fetch --no-tags origin "$BASE_REF"
            sha="$(git rev-parse FETCH_HEAD)"
          elif git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            # On pull_request the checked-out ref is refs/pull/N/merge. Its first parent is
            # the exact base commit this tree was merged onto, which is what the analysis
            # must be compared against. The event payload's base.sha can be stale if the
            # base branch advanced after the event was created.
            sha="$(git rev-parse 'HEAD^1')"
          else
            sha="$BASE_SHA"
          fi
          echo "Base revision: $sha (event payload reported '${BASE_SHA:-none}')"
          printf 'ref=%s\n' "$BASE_REF" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Install Capslock
        run: go install github.com/google/capslock/cmd/capslock@"$CAPSLOCK_VERSION"

      # The "Capslock Capability Baseline" workflow analyses the head of every push to main
      # and publishes the result as an artifact, which is where the baseline normally comes
      # from. The Actions cache is deliberately not used: it is evicted once the repository
      # passes its 10 GB cache allowance, which silently sent every pull request back to
      # regenerating the baseline from source.
      #
      # Regenerating is still the fallback, for what the artifact cannot cover: the baseline
      # run failed, never ran, or is taking too long, its artifact expired, or the GitHub API
      # could not be reached. That costs this job the full analysis of the base commit, so it
      # is flagged in a warning and in the PR comment, where a fallback that starts happening
      # on every pull request gets noticed rather than silently paid for.
      #
      # A pull request synced just after main moved finds the baseline run for its base
      # still going. Waiting for it here means no failed check and no manual re-run. A
      # re-run would find that baseline once the run finished, since it reuses the original
      # event's merge commit and so resolves the same base, but it never picks up a newer one.
      - name: Fetch baseline artifact for the base revision
        id: baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          NAME: ${{ matrix.name }}
          WORKFLOW: capslock.yml
          # A baseline run takes a few minutes. This bounds how long to wait for it before
          # analysing the base commit here instead.
          WAIT_SECONDS: 1200
        run: |
          set -euo pipefail
          mkdir -p capslock-out
          target="$GITHUB_WORKSPACE/capslock-out/${NAME}.json"
          err="$RUNNER_TEMP/gh-api-${NAME}.err"

          # Same name capslock.yml gives the artifact; change both together. It encodes the
          # Capslock version and flags, so a baseline from a different analyser is never
          # compared with this one: its differences would be reported as the pull request's.
          ARTIFACT="capslock-baseline-${NAME}-${CAPSLOCK_VERSION}-$(printf '%s' "$CAPSLOCK_FLAGS" | sha256sum | cut -c1-12)"
          export ARTIFACT

          # Why no baseline could be used, from most to least specific. A failed fetch
          # outranks the rest, since the run it was fetching from may have held a good one.
          fetch_error=""
          expired=""
          # Runs already settled, so polling does not download from them again.
          tried=" "
          retries=0

          # Hands over to the next step, which analyses the base commit instead. Never fails
          # this step: the reason is what a reviewer needs, so it goes in the warning and,
          # via the output, in the PR comment.
          fall_back() {
            echo "::warning title=Capslock baseline regenerated::$1. Analysing ${BASE_SHA} in this job instead, which takes longer."
            printf 'found=false\nreason=%s\n' "$1" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # A failed call (auth, permissions, rate limit, outage) is reported with GitHub's
          # own message and returns non-zero, so it is never mistaken for an empty result.
          # The warning goes to stderr because callers capture stdout.
          api() {
            if ! gh api "$@" 2>"${err}"; then
              echo "::warning::gh api $1 failed: $(tr '\n' ' ' < "${err}")" >&2
              return 1
            fi
          }

          list_runs() {
            api "repos/${REPO}/actions/workflows/${WORKFLOW}/runs?head_sha=${BASE_SHA}&per_page=20" \
              --jq '.workflow_runs[] | "\(.id) \(.status)"'
          }

          # Downloads the baseline from one run, writing the provenance output on success.
          # Returns 1 when the run has no usable baseline and 2 when fetching it failed, which
          # may be transient. A run still in progress has none yet, since it uploads last.
          download() {
            local run_id=$1 is_expired
            # Expired artifacts are listed but cannot be downloaded, so they are only noted.
            if ! is_expired="$(api "repos/${REPO}/actions/runs/${run_id}/artifacts" \
              --jq '[.artifacts[] | select(.name == env.ARTIFACT)] | sort_by(.expired) | first // empty | .expired')"; then
              fetch_error="Could not list the artifacts of baseline run ${run_id} (see the gh api warning in the job log)"
              return 2
            fi
            [ -n "${is_expired}" ] || return 1
            if [ "${is_expired}" = true ]; then
              expired="${run_id}"
              return 1
            fi
            if ! gh run download "${run_id}" --repo "${REPO}" --name "${ARTIFACT}" --dir capslock-out; then
              echo "::warning::Could not download ${ARTIFACT} from run ${run_id}"
              fetch_error="Could not download ${ARTIFACT} from baseline run ${run_id} (see the job log)"
              return 2
            fi
            if [ ! -s "${target}" ]; then
              echo "::warning::${ARTIFACT} (run ${run_id}) did not contain ${NAME}.json"
              fetch_error="${ARTIFACT} from baseline run ${run_id} did not contain ${NAME}.json"
              rm -f "${target}"
              return 1
            fi
            echo "::notice::Baseline from artifact ${ARTIFACT} (run ${run_id})"
            printf 'found=true\nsource=artifact `%s` from [run %s](%s/%s/actions/runs/%s)\n' \
              "${ARTIFACT}" "${run_id}" "${GITHUB_SERVER_URL}" "${REPO}" "${run_id}" >> "$GITHUB_OUTPUT"
          }

          # Tries every completed run in `runs` not settled before, and ends the step on the
          # first usable baseline. Leaves `pending` holding the runs still worth waiting for:
          # those not finished, plus any whose fetch failed, which get a couple more tries.
          try_runs() {
            local run_id status rc
            pending=""
            while read -r run_id status; do
              if [ "${status}" != completed ]; then
                pending="${pending:+${pending} }${run_id}"
                # A re-run keeps the run id, so a run settled earlier is tried again once
                # its new attempt ends.
                tried="${tried/ ${run_id} / }"
              elif [[ "${tried}" != *" ${run_id} "* ]]; then
                if download "${run_id}"; then exit 0; else rc=$?; fi
                if [ "${rc}" -eq 2 ] && [ "${retries}" -lt 2 ]; then
                  retries=$((retries + 1))
                  pending="${pending:+${pending} }${run_id}"
                else
                  tried="${tried}${run_id} "
                fi
              fi
            done <<< "${runs}"
          }

          # Selected by head SHA rather than by taking the newest run on main: a baseline
          # built from a later commit would report that commit's capability changes as this
          # pull request's. Candidates are the run for the push that made this commit the tip
          # of main plus any manual run for the same commit, newest first.
          runs="$(list_runs)" \
            || fall_back "Could not list baseline runs for ${BASE_SHA} (see the gh api warning in the job log)"
          [ -n "${runs}" ] || fall_back "No baseline run exists for ${BASE_SHA}"
          try_runs

          # Runs are listed again on every poll rather than one run being watched, so that
          # whichever finishes first is used: a manual run for the same commit queues behind
          # the push run, and either may end without an artifact.
          if [ -n "${pending}" ]; then
            echo "Waiting up to ${WAIT_SECONDS}s for baseline run(s) ${pending} for ${BASE_SHA}."
            deadline=$((SECONDS + WAIT_SECONDS))
            failures=0
            while [ -n "${pending}" ]; do
              # A run left pending only for a fetch retry has finished, so a recorded fetch
              # error is the better reason here too.
              [ "${SECONDS}" -lt "${deadline}" ] \
                || fall_back "${fetch_error:-Baseline run(s) ${pending} for ${BASE_SHA} had not finished after ${WAIT_SECONDS}s}"
              sleep 30
              if runs="$(list_runs)"; then
                failures=0
                try_runs
              else
                # One failed poll is not worth a full analysis, but an API that keeps failing
                # is not going to deliver the artifact either.
                failures=$((failures + 1))
                [ "${failures}" -lt 3 ] \
                  || fall_back "Could not poll baseline runs for ${BASE_SHA} (see the gh api warnings in the job log)"
              fi
            done
          fi

          [ -z "${fetch_error}" ] || fall_back "${fetch_error}"
          if [ -n "${expired}" ]; then
            fall_back "The baseline for ${BASE_SHA} (run ${expired}) has expired, as baselines are kept for 30 days. The next push to main publishes a fresh one, as does a manual run of the Capslock Capability Baseline workflow while ${BASE_SHA} is still the tip of main"
          fi
          fall_back "No baseline run for ${BASE_SHA} published ${ARTIFACT}, which names the Capslock version and flags this job uses"

      - name: Generate baseline from the base revision
        if: steps.baseline.outputs.found != 'true'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          NAME: ${{ matrix.name }}
          DIR: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null || git fetch --no-tags origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          cd "$RUNNER_TEMP/base/$DIR"
          capslock $CAPSLOCK_FLAGS -output=json > "$GITHUB_WORKSPACE/capslock-out/${NAME}.json"

      # Exit status 0 means no difference, 1 means a difference was found, and 2 or above
      # means capslock itself failed.
      - name: Compare against baseline
        id: compare
        working-directory: ${{ matrix.dir }}
        env:
          BASELINE: ${{ github.workspace }}/capslock-out/${{ matrix.name }}.json
          REPORT: ${{ github.workspace }}/capslock-out/${{ matrix.name }}-diff.txt
        run: |
          set -uo pipefail
          status=0
          capslock $CAPSLOCK_FLAGS -output=compare "$BASELINE" > "$REPORT" 2>&1 || status=$?
          cat "$REPORT"
          if [ "$status" -ge 2 ]; then
            printf 'ok=false\n' >> "$GITHUB_OUTPUT"
            echo "::error::capslock could not analyze the packages (exit $status)"
            exit 1
          fi
          printf 'ok=true\n' >> "$GITHUB_OUTPUT"

      - name: Build report
        id: report
        if: always() && steps.compare.outcome != 'skipped'
        env:
          REPORT: ${{ github.workspace }}/capslock-out/${{ matrix.name }}-diff.txt
          NAME: ${{ matrix.name }}
          BASE_REF: ${{ steps.base.outputs.ref }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          COMPARE_OK: ${{ steps.compare.outputs.ok }}
          DEPS_CHANGED: ${{ needs.changes.outputs.deps }}
          BASELINE_SOURCE: ${{ steps.baseline.outputs.source }}
          BASELINE_REASON: ${{ steps.baseline.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT: capslock-diff-${{ matrix.name }}-pr${{ github.event.pull_request.number || github.run_id }}
        run: |
          set -euo pipefail
          LIMIT=50000
          body="$RUNNER_TEMP/comment-${NAME}.md"
          counts="$RUNNER_TEMP/counts-${NAME}.env"
          findings="$RUNNER_TEMP/findings-${NAME}.md"

          # First-party findings are only excluded from the gate while the dependency set
          # is untouched, because then a capability gained by one of this repository's own
          # packages can only come from its own changed code, which the diff already shows.
          #
          # Once a manifest moves, that reasoning fails: a dependency update can make a
          # first-party package newly reach EXEC or NETWORK and Capslock can attribute the
          # finding to that package alone. Excluding it would let the event this gate exists
          # for pass unreviewed, so nothing is excluded and every finding counts towards the
          # blocking total.
          scope='dependencies only; findings against this repository are not gated'
          classify=(./scripts/capslock-classify.sh "$REPORT" --local "$CAPSLOCK_LOCAL")
          if [ "${DEPS_CHANGED:-true}" = 'true' ]; then
            scope='dependencies and first-party packages, because a dependency manifest changed'
            classify=(./scripts/capslock-classify.sh "$REPORT")
          fi

          if [ "${COMPARE_OK:-}" = "true" ]; then
            "${classify[@]}" --counts "$counts" > "$findings"
            cat "$counts" >> "$GITHUB_OUTPUT"
          else
            printf ':x: capslock did not complete, see the [job log](%s).\n' "$RUN_URL" > "$findings"
          fi

          # Naming the run that produced the baseline makes the comparison auditable: a
          # reviewer can see which analysis the findings are relative to. A regenerated
          # baseline carries the reason the artifact could not be used, since a fallback that
          # starts happening on every pull request is something to fix, not to get used to.
          baseline="${BASELINE_SOURCE:-:warning: generated in this job, because no artifact could be used: ${BASELINE_REASON:-reason not recorded}}"

          size="$(wc -c < "$findings" | tr -d '[:space:]')"
          {
            printf '<!-- capslock-diff:%s -->\n' "$NAME"
            printf '## Capslock capability diff: `%s`\n\n' "$NAME"
            # The findings carry their own counts in each section heading, so this line is
            # just the provenance needed to trust them plus where the full call paths are:
            # the classifier trims each finding to one line and the raw report keeps them.
            printf 'Base `%s` (`%.12s`), baseline %s.\n\n' "$BASE_REF" "$BASE_SHA" "$baseline"
            printf 'Scope: %s. Full call paths: [job log](%s) or the `%s` artifact.\n\n' \
              "$scope" "$RUN_URL" "$ARTIFACT"
            head -c "$LIMIT" "$findings" || printf '(findings unavailable)\n'
            if [ "$size" -gt "$LIMIT" ]; then
              printf '\n\nTruncated (%s of %s bytes shown). Full report: `%s` artifact on the [run](%s).\n' \
                "$LIMIT" "$size" "$ARTIFACT" "$RUN_URL"
            fi
          } > "$body"
          cat "$body" >> "$GITHUB_STEP_SUMMARY"
          printf 'body=%s\n' "$body" >> "$GITHUB_OUTPUT"

      - name: Post or update PR comment
        if: |
          always() && steps.report.outcome == 'success'
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          MARKER: '<!-- capslock-diff:${{ matrix.name }} -->'
          BODY: ${{ steps.report.outputs.body }}
        run: |
          set -euo pipefail
          # Reuse this job's own previous comment so pushes update in place.
          ids="$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" --paginate \
            --jq '.[] | select(.user.type == "Bot") | select(.body | startswith(env.MARKER)) | .id' || true)"
          id="$(printf '%s' "$ids" | tail -n 1)"
          if [ -n "$id" ]; then
            jq -n --rawfile body "$BODY" '{body: $body}' \
              | gh api --method PATCH "repos/$REPO/issues/comments/$id" --input - --silent
            echo "Updated comment $id"
          else
            gh pr comment "$PR" --repo "$REPO" --body-file "$BODY"
          fi

      - name: Upload diff artifact
        if: always() && steps.compare.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: capslock-diff-${{ matrix.name }}-pr${{ github.event.pull_request.number || github.run_id }}
          path: capslock-out/${{ matrix.name }}-diff.txt
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Fail on new capabilities
        if: steps.report.outputs.high != '0' && steps.report.outputs.high != ''
        env:
          HIGH: ${{ steps.report.outputs.high }}
          BASE_REF: ${{ steps.base.outputs.ref }}
        run: |
          echo "::error::${HIGH} new high-signal capability use(s) relative to ${BASE_REF}. Code reaching these without a matching change in what it does is the signature of a compromised release -- the job summary lists them, and its scope line says whether first-party packages are included."
          exit 1

      - name: Note non-blocking capability changes
        if: |
          steps.report.outputs.high == '0'
          && steps.report.outputs.added != '0'
          && steps.report.outputs.added != ''
        env:
          LOW: ${{ steps.report.outputs.low }}
          BASE_REF: ${{ steps.base.outputs.ref }}
        run: |
          echo "::notice::No high-signal capability changes relative to ${BASE_REF}; ${LOW:-0} lower-signal change(s) in the job summary."
