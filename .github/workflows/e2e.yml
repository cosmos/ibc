name: E2E

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      lint: ${{ steps.filter.outputs.lint }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            lint:
              - "e2e/**"
              - ".golangci.yml"
              - ".github/workflows/e2e.yml"
            code:
              - "link/**"
              - "e2e/**"
              - "proto/**"
              - "Makefile"
              - ".github/workflows/e2e.yml"

  lint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: e2e/go.mod
          cache-dependency-path: e2e/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: e2e

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: e2e/go.mod
          cache-dependency-path: |
            link/go.sum
            e2e/go.sum
      - run: make build-link
      - run: docker info
      - run: go test -count=1 ./internal/... ./cmd/...
        working-directory: e2e
        env:
          IBC_BIN: ${{ github.workspace }}/link/bin/ibc

  e2e:
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      E2E_MODE: ${{ github.event_name == 'schedule' && 'production' || 'complete' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: e2e/go.mod
          cache-dependency-path: |
            link/go.sum
            e2e/go.sum
      - run: docker info
      - run: make test-e2e

  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: e2e/go.mod
          cache-dependency-path: e2e/go.sum
      - run: docker info
      - run: make check-e2e-matrix
