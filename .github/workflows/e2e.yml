# SPDX-License-Identifier: Apache-2.0

name: E2E

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      lint: ${{ steps.filter.outputs.lint }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            lint:
              - "e2e/**"
              - "gen/go/solidity-abi/**"
              - ".golangci.yml"
              - ".github/workflows/e2e.yml"
            code:
              - "link/**"
              - "e2e/**"
              - "gen/go/solidity-abi/**"
              - "proto/**"
              - "scripts/**"
              - "Makefile"
              - ".github/workflows/e2e.yml"

  lint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: e2e/go.mod
          cache-dependency-path: |
            e2e/go.sum
            gen/go/solidity-abi/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: e2e
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: gen/go/solidity-abi

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: e2e/go.mod
          cache-dependency-path: |
            link/go.sum
            e2e/go.sum
            gen/go/solidity-abi/go.sum
      - run: make build-link
      - run: docker info
      - run: go test -count=1 ./internal/... ./cmd/...
        working-directory: e2e
        env:
          IBC_BIN: ${{ github.workspace }}/link/bin/ibc

  test-apps:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: e2e/go.mod
          cache-dependency-path: e2e/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
      - run: go install github.com/ethereum/go-ethereum/cmd/abigen@v1.17.4
      - run: make check-test-apps

  e2e:
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      E2E_MODE: ${{ github.event_name == 'schedule' && 'production' || 'complete' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: e2e/go.mod
          cache-dependency-path: |
            link/go.sum
            e2e/go.sum
            gen/go/solidity-abi/go.sum
      - run: docker info
      - run: make test-e2e

  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: e2e/go.mod
          cache-dependency-path: |
            e2e/go.sum
            gen/go/solidity-abi/go.sum
      - run: docker info
      - run: make check-e2e-matrix
