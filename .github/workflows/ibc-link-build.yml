# SPDX-License-Identifier: Apache-2.0

name: Link Build Artifacts

on:
  workflow_dispatch:
  push:
    tags: ["*"]
  pull_request_target:
    # PR must contain `build-artifacts` label
    types: [closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.base.ref || github.ref }}
  cancel-in-progress: true

permissions: read-all

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  BUILD_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
  GO_BUILD_FLAGS: -trimpath -ldflags="-s -w"

jobs:
  # Build binaries
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }} binary
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'push' ||
      (github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'build-artifacts'))
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            artifact: ibc-darwin-arm64
          - goos: linux
            goarch: amd64
            artifact: ibc-linux-amd64
          - goos: linux
            goarch: arm64
            artifact: ibc-linux-arm64
    defaults:
      run:
        working-directory: link
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.BUILD_SHA }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: link/go.mod
          cache-dependency-path: |
            link/go.sum
            gen/go/solidity-abi/go.sum
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p "dist/${{ matrix.artifact }}"
          go build ${{ env.GO_BUILD_FLAGS }} -o "dist/${{ matrix.artifact }}/ibc" ./cmd/ibc/...
      - name: Checksum
        run: |
          cd "dist/${{ matrix.artifact }}"
          shasum -a 256 ibc > ibc.sha256
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: link/dist/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30

  # Prepare Docker metadata
  image-metadata:
    name: Prepare Docker metadata
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'push' ||
      (github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'build-artifacts'))
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Select image tag
        id: tag
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ -n "$BASE_BRANCH" ]]; then
            tag="$BASE_BRANCH"
          elif [[ "$REF_TYPE" == "branch" || "$REF_TYPE" == "tag" ]]; then
            tag="$REF_NAME"
          else
            tag="${BUILD_SHA:0:8}"
          fi

          tag=$(printf '%s' "$tag" | tr '[:upper:]/' '[:lower:]-' | tr -c '[:alnum:]_.-' '-')
          echo "image_tag=${tag:0:128}" >> "$GITHUB_OUTPUT"

  # Publish Docker images
  publish-image:
    name: Publish linux-${{ matrix.goarch }} image
    needs: [image-metadata, build]
    runs-on: depot-ubuntu-24.04-4
    permissions:
      contents: read
      packages: write
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.BUILD_SHA }}
      - name: Download Binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ibc-linux-${{ matrix.goarch }}
          path: image
      - name: Prepare image context
        run: chmod +x image/ibc
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: image
          file: link/Dockerfile
          target: target-artifact
          platforms: linux/${{ matrix.goarch }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ needs.image-metadata.outputs.image_tag }}-linux-${{ matrix.goarch }}

  # Publish multi-platform image, so the same tag can be used for various architectures
  publish-manifest:
    name: Publish multi-platform image
    needs: [image-metadata, publish-image]
    runs-on: depot-ubuntu-24.04-4
    permissions:
      packages: write
    timeout-minutes: 10
    env:
      IMAGE_TAG: ${{ needs.image-metadata.outputs.image_tag }}
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish manifest
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${IMAGE_TAG}" \
            "${IMAGE_NAME}:${IMAGE_TAG}-linux-amd64" \
            "${IMAGE_NAME}:${IMAGE_TAG}-linux-arm64"
          docker buildx imagetools inspect "${IMAGE_NAME}:${IMAGE_TAG}"
