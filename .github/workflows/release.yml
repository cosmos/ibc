# SPDX-License-Identifier: Apache-2.0

name: Release
# Builds the IBC CLI archives for every version tag, generates an SBOM and build provenance for them,
# signs a checksums file over them, and attaches everything to a draft release so the signed
# assets exist before the release is published. It also publishes the signed container image built
# from the same linux binaries.
#
# The attesting, signing and publishing steps are the shared actions in .github/actions, which
# cosmos/ibc-go and cosmos/ibc-contracts use too. This repository uses them from the tagged commit.

on:
  push:
    tags: ["v*", "cli-v*"]
  # Run manually from a tag ("Use workflow from" or `gh workflow run release.yml --ref <tag>`) to
  # release it, with the same ref, commit and signing identity as a tag push; the tag input is then
  # ignored. Run it from a branch to test the workflow: a dry run that builds the chosen tag's
  # source with the branch's workflow, and creates no release and pushes no image.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build in a dry run from a branch. Ignored when running from a tag.
        required: true
        type: choice
        # GitHub can't list tags here dynamically: add each new CLI release tag.
        options:
          - cli-v0.1.0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash

env:
  GO_BUILD_FLAGS: -trimpath -ldflags="-s -w"
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  validate-tag:
    name: Validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      name: ${{ steps.tag.outputs.name }}
      title: ${{ steps.tag.outputs.title }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      dry-run: ${{ steps.tag.outputs.dry-run }}
    steps:
      - name: Check tag format
        id: tag
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "dry-run=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Dry run of ${TAG} with the release workflow from ${GITHUB_REF_NAME}: no release is created and no image is pushed"
            echo "dry-run=true" >> "$GITHUB_OUTPUT"
          fi
          if [[ ! "$TAG" =~ ^(cli-)?(v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::Tag must match vX.Y.Z or cli-vX.Y.Z, optionally followed by -<suffix>"
            exit 1
          fi
          # Both tag forms name the assets and the title after the version alone.
          version="${BASH_REMATCH[2]}"
          suffix="${BASH_REMATCH[3]}"
          {
            echo "name=ibc-${version}"
            echo "title=IBC CLI ${version}"
            if [[ -n "$suffix" ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: [validate-tag]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            runner: ubuntu-latest
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
    env:
      NAME: ${{ needs.validate-tag.outputs.name }}
      PLATFORM: ${{ matrix.goos }}-${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # A dry run builds the chosen tag's source with this branch's workflow and actions, which the
      # tagged commit may not have.
      - name: Check out the tag to test
        if: needs.validate-tag.outputs.dry-run == 'true'
        run: |
          cp -R .github/actions "${RUNNER_TEMP}/release-actions"
          git fetch --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
          git checkout --detach "refs/tags/${TAG}"
          rm -rf .github/actions
          mkdir -p .github
          cp -R "${RUNNER_TEMP}/release-actions" .github/actions
          echo "::notice::Building ${TAG} ($(git rev-parse HEAD)) with the release workflow from ${GITHUB_REF_NAME}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: cli/go.mod
          cache: false
      - name: Build
        working-directory: cli
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ${{ env.GO_BUILD_FLAGS }} -o dist/ibc ./cmd/ibc/...
      - name: Collect assets
        run: |
          mkdir -p out/assets
          cp LICENSE NOTICE cli/dist/
          tar --sort=name --mtime="@$(git log -1 --format=%ct)" \
            --owner=0 --group=0 --numeric-owner \
            -C cli/dist -cf - ibc LICENSE NOTICE \
            | gzip -n > "out/assets/${NAME}-${PLATFORM}.tar.gz"
      - name: Attest release assets
        uses: ./.github/actions/attest-release-assets
        with:
          name: ${{ env.NAME }}-${{ env.PLATFORM }}
          platform: ${{ env.PLATFORM }}
          sbom-file: cli/dist/ibc
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        if: matrix.goos == 'linux'
      - name: Log in to GHCR
        if: matrix.goos == 'linux'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A dry run builds the image without pushing it, so nothing appears under a release tag.
      - name: Build & Push image
        id: image
        if: matrix.goos == 'linux'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: cli/dist
          file: cli/Dockerfile
          target: target-artifact
          platforms: linux/${{ matrix.goarch }}
          push: ${{ needs.validate-tag.outputs.dry-run == 'false' }}
          # Disable BuildKit's unsigned attestation, so the pushed digest is the platform image
          # itself rather than an index wrapping it.
          provenance: false
          tags: ${{ env.IMAGE_NAME }}:${{ env.TAG }}-${{ env.PLATFORM }}
      # The platform image gets its provenance and SBOM; the index is signed in publish-manifest.
      - name: Attest image
        if: matrix.goos == 'linux' && needs.validate-tag.outputs.dry-run == 'false'
        uses: ./.github/actions/attest-image
        with:
          image: ${{ env.IMAGE_NAME }}
          digest: ${{ steps.image.outputs.digest }}

  # Publish multi-platform image, so the same tag can be used for various architectures
  publish-manifest:
    name: Publish multi-platform image
    needs: [validate-tag, build]
    if: needs.validate-tag.outputs.dry-run == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish manifest
        id: index
        run: |
          metadata="${RUNNER_TEMP}/index-metadata.json"
          docker buildx imagetools create \
            --metadata-file "$metadata" \
            --tag "${IMAGE_NAME}:${TAG}" \
            "${IMAGE_NAME}:${TAG}-linux-amd64" \
            "${IMAGE_NAME}:${TAG}-linux-arm64"
          docker buildx imagetools inspect "${IMAGE_NAME}:${TAG}"
          # The digest of the index this step pushed, rather than whatever the tag points to now.
          # --metadata-file needs buildx v0.32.0 or later. setup-buildx-action without a version
          # uses the runner image's buildx.
          echo "digest=$(jq -r '."containerimage.descriptor".digest' "$metadata")" >> "$GITHUB_OUTPUT"
      - name: Attest and sign image
        uses: ./.github/actions/attest-image
        with:
          image: ${{ env.IMAGE_NAME }}
          digest: ${{ steps.index.outputs.digest }}
          sbom: "false"
          sign: "true"
          # Also signs the platform manifests referenced by the index.
          recursive: "true"

  # Waits for publish-manifest as well, so a draft release always comes with a signed image. A dry
  # run skips publish-manifest.
  release:
    name: Attach signed assets to draft release
    needs: [validate-tag, build, publish-manifest]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.publish-manifest.result == 'success' || needs.validate-tag.outputs.dry-run == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - name: Publish draft release
        uses: ./.github/actions/publish-draft-release
        with:
          name: ${{ needs.validate-tag.outputs.name }}
          title: ${{ needs.validate-tag.outputs.title }}
          prerelease: ${{ needs.validate-tag.outputs.prerelease }}
          dry-run: ${{ needs.validate-tag.outputs.dry-run }}
