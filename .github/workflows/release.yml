# SPDX-License-Identifier: Apache-2.0

name: Release
# Builds the IBC CLI archives for every version tag, generates an SBOM and build provenance for them,
# signs a checksums file over them, and attaches everything to a draft release so the signed
# assets exist before the release is published. It also publishes the signed container image built
# from the same linux binaries.

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash

env:
  GO_BUILD_FLAGS: -trimpath -ldflags="-s -w"
  TAG: ${{ github.ref_name }}
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  validate-tag:
    name: Validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      name: ${{ steps.tag.outputs.name }}
      title: ${{ steps.tag.outputs.title }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Check tag format
        id: tag
        run: |
          if [[ ! "$TAG" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::Tag must match vX.Y.Z or vX.Y.Z-<suffix>"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          suffix="${BASH_REMATCH[2]}"
          {
            echo "name=ibc-${version}"
            echo "title=IBC CLI ${version}"
            if [[ -n "$suffix" ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: [validate-tag]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            runner: ubuntu-latest
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
    env:
      NAME: ${{ needs.validate-tag.outputs.name }}
      PLATFORM: ${{ matrix.goos }}-${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: cli/go.mod
          cache: false
      - name: Build
        working-directory: cli
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ${{ env.GO_BUILD_FLAGS }} -o dist/ibc ./cmd/ibc/...
      - name: Collect assets
        run: |
          mkdir -p out/assets out/sbom out/attestations
          cp LICENSE NOTICE cli/dist/
          tar --sort=name --mtime="@$(git log -1 --format=%ct)" \
            --owner=0 --group=0 --numeric-owner \
            -C cli/dist -cf - ibc LICENSE NOTICE \
            | gzip -n > "out/assets/${NAME}-${PLATFORM}.tar.gz"
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: cli/dist/ibc
          format: spdx-json
          output-file: out/sbom/${{ env.NAME }}-${{ env.PLATFORM }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest build provenance
        id: attest-provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/assets/*
      - name: Collect provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.attest-provenance.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "out/attestations/${PLATFORM}.provenance.json"
      - name: Attest SBOM
        id: attest-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/assets/*
          sbom-path: out/sbom/${{ env.NAME }}-${{ env.PLATFORM }}.spdx.json
      - name: Collect SBOM bundle
        env:
          BUNDLE_PATH: ${{ steps.attest-sbom.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "out/attestations/${PLATFORM}.sbom.json"
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-${{ env.PLATFORM }}
          path: out/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        if: matrix.goos == 'linux'
      - name: Log in to GHCR
        if: matrix.goos == 'linux'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push image
        id: image
        if: matrix.goos == 'linux'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: cli/dist
          file: cli/Dockerfile
          target: target-artifact
          platforms: linux/${{ matrix.goarch }}
          push: true
          # Disable BuildKit's unsigned attestation, so the pushed digest is the platform image
          # itself rather than an index wrapping it.
          provenance: false
          tags: ${{ env.IMAGE_NAME }}:${{ env.TAG }}-${{ env.PLATFORM }}
      - name: Attest image provenance
        if: matrix.goos == 'linux'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Generate image SBOM
        if: matrix.goos == 'linux'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: image.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest image SBOM
        if: matrix.goos == 'linux'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: image.spdx.json
          push-to-registry: true

  # Publish multi-platform image, so the same tag can be used for various architectures
  publish-manifest:
    name: Publish multi-platform image
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish manifest
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${TAG}" \
            "${IMAGE_NAME}:${TAG}-linux-amd64" \
            "${IMAGE_NAME}:${TAG}-linux-arm64"
          docker buildx imagetools inspect "${IMAGE_NAME}:${TAG}"
      - name: Resolve index digest
        id: index
        run: |
          digest=$(docker buildx imagetools inspect "${IMAGE_NAME}:${TAG}" \
            --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        # --recursive also signs the platform manifests referenced by the index.
        run: cosign sign --yes --recursive "${IMAGE_NAME}@${DIGEST}"

  # This job is kept identical across cosmos/ibc, cosmos/ibc-go and cosmos/ibc-contracts.
  # Repository-specific behaviour belongs in the tag patterns, validate-tag and build.
  release:
    name: Attach signed assets to draft release
    needs: [validate-tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    timeout-minutes: 15
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      NAME: ${{ needs.validate-tag.outputs.name }}
      TITLE: ${{ needs.validate-tag.outputs.title }}
      PRERELEASE: ${{ needs.validate-tag.outputs.prerelease }}
    steps:
      - name: Download assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-assets*
          path: out
          merge-multiple: true
      - name: Assemble assets
        run: |
          mkdir dist
          mv out/assets/* out/sbom/* dist/
          (cd dist && sha256sum -- * > checksums.txt && cat checksums.txt)
          jq -c . out/attestations/*.json > "dist/${NAME}.intoto.jsonl"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign checksums
        working-directory: dist
        run: cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt
      - name: Write verification notes
        env:
          CERT_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          # Use the first release asset that is not an SBOM, checksum or attestation file as the example.
          for path in dist/*; do
            case "$path" in
              *.spdx.json | *.intoto.jsonl | dist/checksums.txt*) ;;
              *) example="${path#dist/}" && break ;;
            esac
          done
          cat > verify.md <<EOF
          ## Verifying the release

          Verify the build provenance of a release asset. Add
          \`--predicate-type https://spdx.dev/Document/v2.3\` to verify its SBOM instead, or
          \`--bundle ${NAME}.intoto.jsonl\` to verify offline:

          \`\`\`sh
          gh attestation verify ${example} \\
            --repo ${GH_REPO} \\
            --signer-workflow ${GITHUB_WORKFLOW_REF%@*} \\
            --source-ref ${GITHUB_REF}
          \`\`\`

          Or verify the signed checksums and then the assets against them:

          \`\`\`sh
          cosign verify-blob checksums.txt \\
            --bundle checksums.txt.sigstore.json \\
            --certificate-identity "${CERT_IDENTITY}" \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          sha256sum --check --ignore-missing checksums.txt
          # or, on macOS without sha256sum:
          shasum -a 256 --check --ignore-missing checksums.txt
          \`\`\`
          EOF
      - name: Create or update draft release
        run: |
          if ! is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null); then
            prerelease=()
            if [[ "$PRERELEASE" == "true" ]]; then
              prerelease=(--prerelease)
            fi
            gh release create "$TAG" dist/* \
              --draft \
              "${prerelease[@]}" \
              --verify-tag \
              --title "$TITLE" \
              --notes-file verify.md
            exit 0
          fi

          if [[ "$is_draft" == "true" ]]; then
            # A draft already exists, either from a previous run or drafted in the UI for this tag.
            gh release upload "$TAG" dist/* --clobber
          else
            # The release was published before this workflow finished. Without --clobber, gh
            # refuses to replace assets that people may already have downloaded.
            echo "::warning::Release $TAG was published before its signed assets were attached"
            gh release upload "$TAG" dist/*
          fi

          body=$(gh release view "$TAG" --json body --jq .body)
          if [[ "$body" != *"## Verifying the release"* ]]; then
            printf '%s\n\n%s\n' "$body" "$(cat verify.md)" > notes.md
            gh release edit "$TAG" --notes-file notes.md
          fi
