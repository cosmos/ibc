# SPDX-License-Identifier: Apache-2.0

name: Release
# Builds the IBC CLI archives for every cli-v* tag, generates an SBOM and build provenance for them,
# signs a checksums file over them, and attaches everything to a draft release so the signed
# assets exist before the release is published. Once the draft is in place, it publishes the signed
# container image built from the same linux binaries.
#
# The attesting, signing and publishing steps are the shared actions in .github/actions, which
# cosmos/ibc-go and cosmos/ibc-contracts use too. This repository uses them from the tagged commit.

on:
  push:
    tags: ["cli-v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash

env:
  GO_BUILD_FLAGS: -trimpath -ldflags="-s -w"
  TAG: ${{ github.ref_name }}
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  validate-tag:
    name: Validate tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      name: ${{ steps.tag.outputs.name }}
      title: ${{ steps.tag.outputs.title }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Check tag format
        id: tag
        run: |
          if [[ ! "$TAG" =~ ^cli-(v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::Tag must match cli-vX.Y.Z, optionally followed by -<suffix>"
            exit 1
          fi
          # The assets and the title are named after the version alone, without the cli- prefix.
          version="${BASH_REMATCH[1]}"
          suffix="${BASH_REMATCH[2]}"
          {
            echo "name=ibc-${version}"
            echo "title=IBC CLI ${version}"
            if [[ -n "$suffix" ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi
          } >> "$GITHUB_OUTPUT"
      # Full history without trees: enough to tell which branches contain the tagged commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: tree:0
      - name: Check tagged commit is on a protected main or release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only sign commits that were reviewed into main or a release/* branch, i.e. a branch whose
          # ruleset requires a pull request with at least one approval. Classic branch protection does
          # not show up in this API. The check runs from the tagged commit, so it guards against
          # tagging an unreviewed commit by mistake; the tag ruleset is what limits who can get a
          # commit signed.
          branches=$(git branch --remotes --contains "$GITHUB_SHA" --format='%(refname:lstrip=3)')
          while IFS= read -r branch; do
            if [[ "$branch" != main && "$branch" != release/* ]]; then
              continue
            fi
            if gh api "repos/${GITHUB_REPOSITORY}/rules/branches/${branch}" \
              --jq '.[] | select(.type == "pull_request" and .parameters.required_approving_review_count >= 1) | .type' \
              | grep -qx pull_request; then
              exit 0
            fi
          done <<< "$branches"
          echo "::error::Tagged commit ${GITHUB_SHA} is not on main or a release/* branch whose ruleset requires an approved pull request"
          exit 1

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: [validate-tag]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            runner: ubuntu-latest
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
    env:
      NAME: ${{ needs.validate-tag.outputs.name }}
      PLATFORM: ${{ matrix.goos }}-${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: cli/go.mod
          cache: false
      - name: Build
        working-directory: cli
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ${{ env.GO_BUILD_FLAGS }} -o dist/ibc ./cmd/ibc/...
      - name: Collect assets
        run: |
          mkdir -p out/assets
          cp LICENSE NOTICE cli/dist/
          tar --sort=name --mtime="@$(git log -1 --format=%ct)" \
            --owner=0 --group=0 --numeric-owner \
            -C cli/dist -cf - ibc LICENSE NOTICE \
            | gzip -n > "out/assets/${NAME}-${PLATFORM}.tar.gz"
      - name: Attest release assets
        uses: ./.github/actions/attest-release-assets
        with:
          name: ${{ env.NAME }}-${{ env.PLATFORM }}
          platform: ${{ env.PLATFORM }}
          sbom-file: cli/dist/ibc
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        if: matrix.goos == 'linux'
      - name: Log in to GHCR
        if: matrix.goos == 'linux'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push image
        id: image
        if: matrix.goos == 'linux'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: cli/dist
          file: cli/Dockerfile
          target: target-artifact
          platforms: linux/${{ matrix.goarch }}
          # Pushed by digest only. A platform tag could be moved before publish-manifest reads it.
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # Disable BuildKit's unsigned attestation, so the pushed digest is the platform image
          # itself rather than an index wrapping it.
          provenance: false
      # The platform image gets its provenance and SBOM; the index is signed in publish-manifest.
      - name: Attest image
        if: matrix.goos == 'linux'
        uses: ./.github/actions/attest-image
        with:
          image: ${{ env.IMAGE_NAME }}
          digest: ${{ steps.image.outputs.digest }}
      # publish-manifest builds the index from these digests, so it only references images
      # attested above.
      - name: Save image digest
        if: matrix.goos == 'linux'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/image-digest"
          echo "$DIGEST" > "${RUNNER_TEMP}/image-digest/${PLATFORM}"
      - name: Upload image digest
        if: matrix.goos == 'linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest-${{ env.PLATFORM }}
          path: ${{ runner.temp }}/image-digest/${{ env.PLATFORM }}
          if-no-files-found: error
          retention-days: 1

  # Runs before publish-manifest, so the image is only published once the assets verify against
  # their attestations. A re-run after the release is published fails here, at the upload without
  # --clobber, before it can move the published image tag.
  release:
    name: Attach signed assets to draft release
    needs: [validate-tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - name: Publish draft release
        uses: ./.github/actions/publish-draft-release
        with:
          name: ${{ needs.validate-tag.outputs.name }}
          title: ${{ needs.validate-tag.outputs.title }}
          prerelease: ${{ needs.validate-tag.outputs.prerelease }}

  # Publish multi-platform image, so the same tag can be used for various architectures
  publish-manifest:
    name: Publish multi-platform image
    needs: [build, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          # imagetools create --metadata-file needs buildx v0.32.0 or later.
          version: v0.38.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/image-digest
          merge-multiple: true
      - name: Publish manifest
        id: index
        run: |
          metadata="${RUNNER_TEMP}/index-metadata.json"
          sources=()
          for platform in linux-amd64 linux-arm64; do
            digest=$(< "${RUNNER_TEMP}/image-digest/${platform}")
            sources+=("${IMAGE_NAME}@${digest}")
          done
          docker buildx imagetools create \
            --metadata-file "$metadata" \
            --tag "${IMAGE_NAME}:${TAG}" \
            "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE_NAME}:${TAG}"
          # The digest of the index this step pushed, rather than whatever the tag points to now.
          echo "digest=$(jq -r '."containerimage.descriptor".digest' "$metadata")" >> "$GITHUB_OUTPUT"
      - name: Attest and sign image
        uses: ./.github/actions/attest-image
        with:
          image: ${{ env.IMAGE_NAME }}
          digest: ${{ steps.index.outputs.digest }}
          sbom: "false"
          sign: "true"
          # Also signs the platform manifests referenced by the index.
          recursive: "true"
