name: Link

on:
  push:
    branches: [main, development]
    paths:
      - "link/**"
      - ".github/workflows/link.yml"
  pull_request:
    branches: [main, development]
    paths:
      - "link/**"
      - ".github/workflows/link.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [link, link/e2e, link/harness]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: ${{ matrix.module }}

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - module: link
            packages: ./...
          - module: link/e2e
            packages: ./e2etest ./internal/... ./stub/...
          - module: link/harness
            packages: ./...
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - if: matrix.module == 'link/harness'
        run: make build
        working-directory: link
      - if: matrix.module == 'link/harness'
        run: docker info
      - if: matrix.module == 'link/harness'
        run: go test -count=1 ${{ matrix.packages }}
        working-directory: ${{ matrix.module }}
        env:
          IBC_BIN: ${{ github.workspace }}/link/bin/ibc
      - if: matrix.module != 'link/harness'
        run: go test ${{ matrix.packages }}
        working-directory: ${{ matrix.module }}

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: link/go.mod
          cache-dependency-path: |
            link/go.sum
            link/e2e/go.sum
            link/harness/go.sum
      - run: docker info
      - run: make test-e2e
        working-directory: link
      - run: make test-e2e E2E_PKGS=./negative
        working-directory: link
