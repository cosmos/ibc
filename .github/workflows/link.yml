name: Link

on:
  push:
    branches: [main, development]
    paths:
      - "link/**"
      - ".github/workflows/link.yml"
  pull_request:
    branches: [main, development]
    paths:
      - "link/**"
      - ".github/workflows/link.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [link, link/e2e, link/harness]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: ${{ matrix.module }}

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - module: link
            packages: ./...
          - module: link/e2e
            # Only the stub's pure-Go tests: the suite packages need Docker lanes
            # and built SUT binaries (make test-e2e), which CI does not provide here.
            packages: ./stub/...
          - module: link/harness
            packages: ./...
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: go test ${{ matrix.packages }}
        working-directory: ${{ matrix.module }}
