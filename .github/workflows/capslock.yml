# SPDX-License-Identifier: Apache-2.0

name: Capslock Capability Baseline

# Only main is baselined.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

env:
  CAPSLOCK_VERSION: v0.3.3
  CAPSLOCK_FLAGS: -packages=./... -granularity=intermediate

jobs:
  baseline:
    name: Baseline ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cli
            dir: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: |
            cli/go.sum
            e2e/go.sum
            gen/go/solidity-abi/go.sum

      - name: Compute ref slug
        id: slug
        env:
          REF: ${{ github.ref_name }}
        run: |
          printf 'slug=%s\n' "$(printf '%s' "$REF" | tr '/' '-' | tr -c '[:alnum:]_.-' '-')" >> "$GITHUB_OUTPUT"

      - name: Install Capslock
        run: go install github.com/google/capslock/cmd/capslock@"$CAPSLOCK_VERSION"

      - name: Generate baseline
        working-directory: ${{ matrix.dir }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/capslock-out"
          capslock $CAPSLOCK_FLAGS -output=json \
            > "$GITHUB_WORKSPACE/capslock-out/${{ matrix.name }}.json"
          ls -lh "$GITHUB_WORKSPACE/capslock-out/${{ matrix.name }}.json"

      - name: Upload baseline artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: capslock-baseline-${{ matrix.name }}-${{ steps.slug.outputs.slug }}
          path: capslock-out/${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true
