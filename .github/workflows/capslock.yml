# SPDX-License-Identifier: Apache-2.0

name: Capslock Capability Baseline

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

env:
  CAPSLOCK_VERSION: v0.3.3
  CAPSLOCK_FLAGS: -packages=./... -granularity=intermediate

jobs:
  changes:
    name: Detect Changes
    runs-on: depot-ubuntu-24.04-4
    permissions:
      contents: read
    outputs:
      go: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            go:
              - 'cli/**'
              - 'e2e/**'
              - 'gen/go/solidity-abi/**'
              - '.github/workflows/capslock.yml'

  baseline:
    name: Baseline ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: depot-ubuntu-24.04-4
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cli
            dir: cli
          - name: e2e
            dir: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: |
            cli/go.sum
            e2e/go.sum
            gen/go/solidity-abi/go.sum

      - name: Compute ref slug
        id: slug
        env:
          REF: ${{ github.ref_name }}
        run: |
          printf 'slug=%s\n' "$(printf '%s' "$REF" | tr '/' '-' | tr -c '[:alnum:]_.-' '-')" >> "$GITHUB_OUTPUT"

      - name: Install Capslock
        run: go install github.com/google/capslock/cmd/capslock@"$CAPSLOCK_VERSION"

      - name: Generate baseline
        working-directory: ${{ matrix.dir }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/capslock-out"
          capslock $CAPSLOCK_FLAGS -output=json \
            > "$GITHUB_WORKSPACE/capslock-out/${{ matrix.name }}.json"
          ls -lh "$GITHUB_WORKSPACE/capslock-out/${{ matrix.name }}.json"

      - name: Save baseline to branch cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: capslock-out/${{ matrix.name }}.json
          key: capslock-${{ env.CAPSLOCK_VERSION }}-${{ runner.os }}-${{ matrix.name }}-${{ steps.slug.outputs.slug }}-${{ github.sha }}

      - name: Upload baseline artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: capslock-baseline-${{ matrix.name }}-${{ steps.slug.outputs.slug }}
          path: capslock-out/${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true
