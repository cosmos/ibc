# SPDX-License-Identifier: Apache-2.0

name: Capslock Capability Baseline

# Analyses main and publishes it as the artifact capslock-diff.yml compares pull requests
# against, looked up by commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Same values as capslock-diff.yml. If they differ, pull requests analyse whatever the
# artifact lacks from their base commit themselves.
env:
  CAPSLOCK_VERSION: v0.3.3
  CAPSLOCK_MODULES: cli e2e
  # How cli is released; cgo also widens what a dependency can do unseen.
  CGO_ENABLED: "0"

jobs:
  baseline:
    name: Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: |
            cli/go.sum
            e2e/go.sum
            gen/go/solidity-abi/go.sum

      - name: Analyse
        run: |
          set -euo pipefail
          go install github.com/google/capslock/cmd/capslock@"$CAPSLOCK_VERSION"
          mkdir -p capslock-out
          for m in $CAPSLOCK_MODULES; do
            for g in intermediate function; do
              (cd "$m" && capslock -packages=./... -granularity="$g" -output=json) > "capslock-out/$m-$g.json"
            done
          done

      # Kept for the longest a public repository allows, for when main is quiet.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: capslock-baseline-${{ env.CAPSLOCK_VERSION }}-cgo${{ env.CGO_ENABLED }}
          path: capslock-out/
          if-no-files-found: error
          retention-days: 90
