# SPDX-License-Identifier: Apache-2.0

# Fuzzes main daily, growing the corpus each run starts from. A crash fails
# the run and is uploaded as an artifact.
name: ClusterFuzzLite batch fuzzing

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  fuzz:
    name: Batch fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      # Downloads the corpus from earlier runs.
      actions: read
    steps:
      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: go
      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: batch
          fuzz-seconds: 3600
