# SPDX-License-Identifier: Apache-2.0

name: Publish draft release
description: >-
  Collects the `release-assets-*` artifacts uploaded by the attest-release-assets action,
  verifies every asset against its attestation bundles, signs a `checksums.txt` over the assets,
  SBOMs and combined attestation bundle with cosign, and attaches everything to a draft release
  for the tag, with a "Verifying the release" section in its notes. Must run for a tag: a tag
  push, or a manual run started from the tag. The calling job needs `contents: write` and
  `id-token: write`.

inputs:
  name:
    description: >-
      File name stem of the combined attestation bundle, e.g. `ibc-v1.2.3`. It is published as
      `<name>.intoto.jsonl`, the suffix OpenSSF Scorecard's Signed-Releases check looks for.
    required: true
  title:
    description: Title of the release, used when the draft is created.
    required: true
  prerelease:
    description: Whether to mark a newly created draft as a pre-release (`true` or `false`).
    required: false
    default: "false"
  verify:
    description: Verify every asset against the attestation bundles before signing (`true` or `false`).
    required: false
    default: "true"
  dry-run:
    description: >-
      Do everything except create or update the release, and upload what would be released as the
      `release-dry-run` artifact instead (`true` or `false`). Can run for a branch, to test the
      release workflow.
    required: false
    default: "false"
  github-token:
    description: Token used to create the release and verify the attestations.
    required: false
    default: ${{ github.token }}

outputs:
  url:
    description: URL of the draft (or already published) release. Empty for a dry run.
    value: ${{ steps.release.outputs.url }}

runs:
  using: composite
  steps:
    - name: Check inputs
      shell: bash
      env:
        NAME: ${{ inputs.name }}
        PRERELEASE: ${{ inputs.prerelease }}
        VERIFY: ${{ inputs.verify }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        # The verification notes name the tag through GITHUB_REF and the signing workflow through
        # GITHUB_WORKFLOW_REF, so the release must be for the tag this run was triggered by.
        if [[ "$DRY_RUN" != "true" && "$GITHUB_REF_TYPE" != "tag" ]]; then
          echo "::error::publish-draft-release must run for a tag (a tag push, or a manual run from the tag), not ${GITHUB_REF}; set dry-run to test it from a branch"
          exit 1
        fi
        if [[ ! "$NAME" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
          echo "::error::name may only contain letters, digits, '.', '_' and '-' (got '${NAME}')"
          exit 1
        fi
        for value in "$PRERELEASE" "$VERIFY" "$DRY_RUN"; do
          if [[ "$value" != "true" && "$value" != "false" ]]; then
            echo "::error::prerelease, verify and dry-run must be 'true' or 'false' (got '${value}')"
            exit 1
          fi
        done

    # Downloaded per artifact rather than merged, so two build jobs that produce an asset with the
    # same name fail the release instead of one silently overwriting the other.
    - name: Download assets
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: release-assets-*
        path: ${{ runner.temp }}/release-in

    - name: Assemble assets
      shell: bash
      env:
        NAME: ${{ inputs.name }}
      run: |
        in="${RUNNER_TEMP}/release-in"
        dist="${RUNNER_TEMP}/release-dist"
        mkdir "$dist"
        : > "${RUNNER_TEMP}/release-assets.txt"
        shopt -s nullglob
        for artifact in "$in"/release-assets-*/; do
          for kind in assets sbom; do
            for path in "${artifact}${kind}"/*; do
              file="${path##*/}"
              if [[ -e "${dist}/${file}" ]]; then
                echo "::error::More than one build job produced ${file}"
                exit 1
              fi
              mv "$path" "${dist}/${file}"
              if [[ "$kind" == "assets" ]]; then
                echo "$file" >> "${RUNNER_TEMP}/release-assets.txt"
              fi
            done
          done
        done
        bundles=("$in"/release-assets-*/attestations/*.json)
        if [[ ! -s "${RUNNER_TEMP}/release-assets.txt" || ${#bundles[@]} -eq 0 ]]; then
          echo "::error::No release assets or attestation bundles were downloaded"
          exit 1
        fi
        for reserved in checksums.txt checksums.txt.sigstore.json "${NAME}.intoto.jsonl"; do
          if [[ -e "${dist}/${reserved}" ]]; then
            echo "::error::A build job produced ${reserved}, which this action generates"
            exit 1
          fi
        done
        # The bundle is written first, so the signed checksums cover it as well.
        jq -c . "${bundles[@]}" > "${dist}/${NAME}.intoto.jsonl"
        (cd "$dist" && sha256sum -- * > checksums.txt && cat checksums.txt)

    - name: Verify assets against the attestation bundles
      if: inputs.verify == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        NAME: ${{ inputs.name }}
      run: |
        # Check the assets against the bundles before signing, the same way the release notes tell
        # users to, so a release never ships an asset that differs from what its build attested
        # or a bundle that does not verify.
        dist="${RUNNER_TEMP}/release-dist"
        while IFS= read -r file; do
          for predicate in https://slsa.dev/provenance/v1 https://spdx.dev/Document/v2.3; do
            gh attestation verify "${dist}/${file}" \
              --bundle "${dist}/${NAME}.intoto.jsonl" \
              --predicate-type "$predicate" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "${GITHUB_WORKFLOW_REF%@*}" \
              --source-ref "$GITHUB_REF"
          done
        done < "${RUNNER_TEMP}/release-assets.txt"

    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Sign checksums
      shell: bash
      run: |
        cd "${RUNNER_TEMP}/release-dist" || exit 1
        cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt

    - name: Write verification notes
      shell: bash
      env:
        NAME: ${{ inputs.name }}
        CERT_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
      run: |
        example=$(head -n 1 "${RUNNER_TEMP}/release-assets.txt")
        cat > "${RUNNER_TEMP}/release-verify.md" <<EOF
        ## Verifying the release

        Verify the build provenance of a release asset. Add
        \`--predicate-type https://spdx.dev/Document/v2.3\` to verify its SBOM instead, or
        \`--bundle ${NAME}.intoto.jsonl\` to verify without the attestations API:

        \`\`\`sh
        gh attestation verify ${example} \\
          --repo ${GITHUB_REPOSITORY} \\
          --signer-workflow ${GITHUB_WORKFLOW_REF%@*} \\
          --source-ref ${GITHUB_REF}
        \`\`\`

        Or verify the signed checksums and then the assets against them:

        \`\`\`sh
        cosign verify-blob checksums.txt \\
          --bundle checksums.txt.sigstore.json \\
          --certificate-identity "${CERT_IDENTITY}" \\
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
        sha256sum --check --ignore-missing checksums.txt
        # or, on macOS without sha256sum:
        shasum -a 256 --check --ignore-missing checksums.txt
        \`\`\`
        EOF

    - name: Upload dry run
      if: inputs.dry-run == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-dry-run
        path: |
          ${{ runner.temp }}/release-dist/
          ${{ runner.temp }}/release-verify.md
        if-no-files-found: error
        overwrite: true
        retention-days: 7

    - name: Create or update draft release
      id: release
      if: inputs.dry-run != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ github.ref_name }}
        TITLE: ${{ inputs.title }}
        PRERELEASE: ${{ inputs.prerelease }}
      run: |
        dist="${RUNNER_TEMP}/release-dist"
        notes="${RUNNER_TEMP}/release-verify.md"

        if view=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1); then
          is_draft="$view"
        elif [[ "$view" == *"release not found"* ]]; then
          prerelease=()
          if [[ "$PRERELEASE" == "true" ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" "$dist"/* \
            --draft \
            "${prerelease[@]}" \
            --verify-tag \
            --title "$TITLE" \
            --notes-file "$notes"
          echo "url=$(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_OUTPUT"
          exit 0
        else
          # Anything other than a missing release (network, rate limit, auth) must not fall through
          # to creating a second release.
          echo "::error::Could not look up release ${TAG}: ${view}"
          exit 1
        fi

        if [[ "$is_draft" == "true" ]]; then
          # A draft already exists, either from a previous run or drafted in the UI for this tag.
          gh release upload "$TAG" "$dist"/* --clobber
        else
          # The release was published before this workflow finished. Without --clobber, gh refuses
          # to replace assets that people may already have downloaded, so a re-run after publishing
          # fails here instead of swapping assets under a published release.
          echo "::warning::Release ${TAG} was published before its signed assets were attached"
          gh release upload "$TAG" "$dist"/*
        fi

        body=$(gh release view "$TAG" --json body --jq .body)
        if [[ "$body" != *"## Verifying the release"* ]]; then
          printf '%s\n\n%s\n' "$body" "$(cat "$notes")" > "${RUNNER_TEMP}/release-notes.md"
          gh release edit "$TAG" --notes-file "${RUNNER_TEMP}/release-notes.md"
        fi
        echo "url=$(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_OUTPUT"
