# sample config file
server:
  listenAddr: 0.0.0.0:3000
  # listenAddr: 127.0.0.1:${SERVER_PORT}  # supports for env vars expansion

db:
  type: sqlite
  url: ibc.db
  # type: postgres
  # url: postgres://user:password@host:port/dbname

# chains declares chain information shared by the attestor and relayer;
# referenced by other blocks via chainId
chains:
  - chainId: "1"
    evm:
      rpc: https://ethereum-rpc.example.com
      ics26Router: "0x0000000000000000000000000000000000000000"
  - chainId: "8453"
    evm:
      rpc: https://base-rpc.example.com
      ics26Router: "0x0000000000000000000000000000000000000000"

relayer:
  # relay specific chain settings
  chainOverrides:
    - chainId: "1"
      txSubmissionDelay: 5s
      packetBatchSize: 50

  # a client and its counterparty both need to be configured
  clients:
    - alias: "eth-to-base"
      clientId: "base-0"
      chainId: "1"
      counterpartyChainId: "8453"
      counterpartyClientId: "ethereum-0"
      type: "attestation"
      attestorSet:
        counterpartyChainFinalityOffset: 1
        threshold: 1
        attestors:
          - name: "attestor-base"
            type: remote
            grpc: attestor.example.com:3000
    - alias: "base-to-eth"
      clientId: "ethereum-0"
      chainId: "8453"
      counterpartyChainId: "1"
      counterpartyClientId: "base-0"
      type: "attestation"
      attestorSet:
        counterpartyChainFinalityOffset: 1
        threshold: 1
        attestors:
          - name: "attestor-ethereum"
            type: remote
            grpc: attestor.example.com:3000

  # packets sent from the source client are relayed through the entire packet
  # lifecycle: recv, ack, timeout; the signer aliases submit the relay
  # transactions on the route's source and destination chains
  routesToRelay:
    - sourceClient: "eth-to-base"
      sourceSignerAlias: "relayer-key"
      destSignerAlias: "relayer-key"
    - sourceClient: "base-to-eth"
      sourceSignerAlias: "relayer-key"
      destSignerAlias: "relayer-key"

  # proof api used to build relay transactions
  proofApi:
    grpc: proof-api.example.com:8080

# signers define signing backends referenced by attestations and the relayer
#
# NOTE: each signer should have a unique alias
signers:
  - alias: "relayer-key"
    type: remote
    grpc: cosmos-kms.example.com:9090
    remoteKeyId: "relayer-key-id"
#   - alias: my-local-signer
#     type: local
#     file: keys/my-key.json

# This section specifies ATTESTOR process configuration for `ibc attestor run`.
# Also enables attestor sub-process with grpc server even for relayer (`ibc relayer run`)
# if attestors list is not empty ("dual" relayer + attestor mode)
#
# NOTE: each attestation should have a unique name and reference a unique signer
attestor:
