# sample config file; replace the example chain and relayer values before use
server:
  listenAddr: 0.0.0.0:3000

db:
  type: sqlite
  url: ibc.db
  # type: postgres
  # url: postgres://user:password@host:port/dbname

# chains declares how to reach each chain; referenced by other blocks via chainId
chains:
  - chainId: "1"
    evm:
      rpc: https://ethereum-rpc.example.com
  - chainId: "8453"
    evm:
      rpc: https://base-rpc.example.com

relayer:
  # chain specific relay configuration
  chains:
    - chainId: "1"
      evm:
        contracts:
          ics26Router: "0x0000000000000000000000000000000000000000"
    - chainId: "8453"
      evm:
        contracts:
          ics26Router: "0x0000000000000000000000000000000000000000"

  # attestors the relayer queries for their associated client
  attestors:
    - alias: "attestor-base"
      type: remote
      grpc: attestor.example.com:3000
      client: "eth-to-base"
    - alias: "attestor-ethereum"
      type: remote
      grpc: attestor.example.com:3000
      client: "base-to-eth"

  # light client information; connections are relayed bi-directionally, so
  # both chains configure a client
  clients:
    - alias: "eth-to-base"
      clientId: "base-0"
      chainId: "1"
      counterpartyChainId: "8453"
      type: "attestation"
      attestorSet:
        threshold: 1
    - alias: "base-to-eth"
      clientId: "ethereum-0"
      chainId: "8453"
      counterpartyChainId: "1"
      type: "attestation"
      attestorSet:
        threshold: 1

  # packets sent from the source client are relayed through the entire packet
  # lifecycle: recv, ack, timeout
  routesToRelay:
    - sourceClient: "eth-to-base"
    - sourceClient: "base-to-eth"
