# sample config file
server:
  listenAddr: 0.0.0.0:3000
  # listenAddr: 127.0.0.1:${SERVER_PORT}  # supports for env vars expansion

db:
  type: sqlite
  url: ibc.db
  # type: postgres
  # url: postgres://user:password@host:port/dbname

# chains declares chain information shared by the attestor and relayer;
# referenced by other blocks via chainId
chains:
  - chainId: "1"
    evm:
      rpc: https://ethereum-rpc.example.com
      ics26Router: "0x0000000000000000000000000000000000000000"
  - chainId: "8453"
    evm:
      rpc: https://base-rpc.example.com
      ics26Router: "0x0000000000000000000000000000000000000000"

relayer:
  # relay specific chain settings
  chainOverrides:
    - chainId: "1"
      txSubmissionDelay: 5s
      packetBatchSize: 50

  # each connection is relayed bidirectionally: clientA's counterparty is
  # simply clientB, and vice versa -- no separate counterparty fields to
  # keep in sync. There's no attestorSet here: the relayer resolves the
  # attestor quorum required for each client end live, by querying that
  # client's on-chain attestation set and matching it against the top-level
  # attestors[] list below -- see attestors[] for how that resolution works.
  connections:
    - alias: "eth-base"
      clientA:
        chainId: "1"
        signer: "eth-relayer-key"
        clientId: "base-0"
        type: "attestation"
        autoRelay:
          enabled: true
          lookback: 100
      clientB:
        chainId: "8453"
        signer: "base-relayer-key"
        clientId: "ethereum-0"
        type: "attestation"
        autoRelay:
          enabled: true
          lookback: 100

# attestors is the unified list of every attestor in play -- both the ones
# this process runs itself (type: local) and the ones it queries over gRPC
# (type: remote). `ibc attestor run` serves only the type: local subset.
#
# `ibc relayer run` resolves each client end's attestor quorum live: it
# queries the client's on-chain attestation set (the authoritative addresses
# and required signature count), then for each entry here asks the attestor
# itself (locally, or via its Info RPC for remote) what chain it watches and
# what address it signs with, and keeps only the entries that both watch the
# right chain and hold an address the chain has actually registered. There's
# no attestorSet/threshold to declare or keep in sync -- the chain is the
# single source of truth for both.
#
# NOTE: `name` is how the relayer identifies which attestor to ask for at a
# given endpoint (local: within this process; remote: at that grpc target).
# It only needs to be unique among this process's own type: local entries --
# two different remote attestors are free to use the same name, since a
# caller always asks a specific endpoint for a specific name, never looks a
# name up across endpoints.
attestors:
  - name: "attestor-base"
    type: remote
    grpc: attestor.example.com:3000
  - name: "attestor-ethereum"
    type: remote
    grpc: attestor.example.com:3000
#  - name: "my-local-attestor"
#    chainId: "1"
#    type: local
#    signer: my-local-signer
#    finalityOffset: 1

# signers define signing backends referenced by attestors and the relayer
#
# NOTE: each signer should have a unique alias
signers:
  - alias: "eth-relayer-key"
    type: remote
    grpc: cosmos-kms.example.com:9090
    remoteKeyId: "eth-relayer-key-id"
  - alias: "base-relayer-key"
    type: remote
    grpc: cosmos-kms.example.com:9090
    remoteKeyId: "base-relayer-key-id"
#   - alias: my-local-signer
#     type: local
#     file: keys/my-key.json
