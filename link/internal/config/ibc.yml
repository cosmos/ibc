# sample config file
server:
  listenAddr: 0.0.0.0:3000
  # listenAddr: 127.0.0.1:${SERVER_PORT}  # supports for env vars expansion

db:
  type: sqlite
  url: ibc.db
  # type: postgres
  # url: postgres://user:password@host:port/dbname

# chains declares each chain's type, connection details, and core IBC
# contracts; referenced by other blocks via chainId
chains:
  - chainId: "1"
    type: evm
    rpc: https://ethereum-rpc.example.com
    evm:
      ics26Router: "0x0000000000000000000000000000000000000000"
  - chainId: "8453"
    type: evm
    rpc: https://base-rpc.example.com
    evm:
      ics26Router: "0x0000000000000000000000000000000000000000"

relayer:
  # optional per-chain overrides of the default relay settings
  chains:
    - chainId: "1"
      evm:
        txSubmissionDelay: 5s
      packetBatchSize: 50

  # attestors the relayer queries for their associated client
  attestors:
    - name: "attestor-base"
      type: remote
      grpc: attestor.example.com:3000
      client: "eth-to-base"
    - name: "attestor-ethereum"
      type: remote
      grpc: attestor.example.com:3000
      client: "base-to-eth"

  # light client information; connections are relayed bi-directionally, so
  # both chains configure a client
  clients:
    - alias: "eth-to-base"
      clientId: "base-0"
      chainId: "1"
      counterpartyChainId: "8453"
      counterpartyClientId: "ethereum-0"
      type: "attestation"
      attestorSet:
        threshold: 1
    - alias: "base-to-eth"
      clientId: "ethereum-0"
      chainId: "8453"
      counterpartyChainId: "1"
      counterpartyClientId: "base-0"
      type: "attestation"
      attestorSet:
        threshold: 1

  # packets sent from the source client are relayed through the entire packet
  # lifecycle: recv, ack, timeout
  routesToRelay:
    - sourceClient: "eth-to-base"
    - sourceClient: "base-to-eth"

# signers define signing backends referenced by attestations
#
# NOTE: each signer should have a unique alias
signers:
#   - alias: my-local-signer
#     type: local
#     file: keys/my-key.json
#
#   - alias: my-remote-signer
#     type: remote
#     grpc: https://cosmos-kms.example.com
#     remoteKeyId: key-id # KMS key ID for a remote signer

# This section specifies ATTESTOR process configuration for `ibc attestor run`.
# Also enables attestor sub-process with grpc server even for relayer (`ibc relayer run`)
# if attestors list is not empty ("dual" relayer + attestor mode)
#
# NOTE: each attestation should have a unique name and reference a unique signer
attestor:
#  attestations:
#     - chainId: chain-a
#       name: attestation-a
#       signer: my-local-signer
#     - chainId: chain-b
#       name: attestation-b
#       signer: my-remote-signer
