server:
  listenAddr: 0.0.0.0:3000
signers:
  - alias: "relayer-key"
    type: remote
    grpc: cosmos-kms.example.com:9090
    remoteKeyId: "relayer-key-id"
  - alias: "attestor-dan-key"
    type: remote
    grpc: cosmos-kms.example.com:9090
    remoteKeyId: "attestor-dan-key-id"
db:
  type: sqlite
  url: ibc.db
chains:
  - chainId: "1"
    evm:
      rpc: https://ethereum-rpc.example.com
      ics26Router: "0xe20BccD900Fa1B48f46F5a483d9De063b07eDFCC"
  - chainId: "8453"
    evm:
      rpc: https://base-rpc.example.com
      ics26Router: "0xe20BccD900Fa1B48f46F5a483d9De063b07eDFCC"
relayer:
  dispatchPollInterval: 3s
  chainOverrides:
    - chainId: "1"
      evm:
        gasFeeCapMultiplier: 1.5
        gasTipCapMultiplier: 1.5
      txSubmissionDelay: 2s
      packetBatchSize: 20
      packetBatchTimeout: 10s
    - chainId: "8453"
  connections:
    - alias: "eth-base"
      clientA:
        chainId: "1"
        signer: "relayer-key"
        clientId: "base-0"
        type: "attestation"
        attestorSet:
          threshold: 2
          counterpartyChainFinalityOffset: 1
          attestors: ["attestor-alice-base", "attestor-bob-base", "attestor-dan-base"]
        autoRelay:
          enabled: false
          lookback: 100
      clientB:
        chainId: "8453"
        signer: "relayer-key"
        clientId: "ethereum-0"
        type: "attestation"
        attestorSet:
          threshold: 1
          counterpartyChainFinalityOffset: 1
          attestors: ["attestor-dan-ethereum"]
attestors:
  - alias: "attestor-alice-base"
    name: "attestor-alice-base"
    chainId: "8453"
    type: remote
    grpc: attestor-alice.example.com:3000
  - alias: "attestor-bob-base"
    name: "attestor-bob-base"
    chainId: "8453"
    type: remote
    grpc: attestor-bob.example.com:3000
  - alias: "attestor-dan-base"
    name: "attestor-dan"
    chainId: "8453"
    type: local
    signer: "attestor-dan-key"
    finalityOffset: 1
  - alias: "attestor-dan-ethereum"
    name: "attestor-dan"
    chainId: "1"
    type: local
    signer: "attestor-dan-key"
