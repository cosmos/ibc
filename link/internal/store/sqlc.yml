# https://docs.sqlc.dev/en/latest/reference/config.html
version: "2"
sql:
  - engine: "sqlite"
    queries: "queries"
    schema: "migrations/sqlite"
    gen:
      go:
        package: "sqlite"
        out: "repository/sqlite"
        # more than two args will be converted to params{}
        query_parameter_limit: 2
        emit_pointers_for_null_types: true

  - engine: "postgresql"
    queries: "queries"
    schema: "migrations/postgres"
    gen:
      go:
        package: "postgres"
        out: "repository/postgres"
        sql_package: "pgx/v5"
        query_parameter_limit: 2
        emit_pointers_for_null_types: true
