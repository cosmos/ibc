template: testify
formatter: gofmt
include-auto-generated: true
packages:
  github.com/cosmos/ibc/link/internal/store:
    config:
      dir: "{{.InterfaceDir}}"
      filename: "store.mock.go"
      pkgname: "{{.SrcPackageName}}"
      structname: "Mock{{.InterfaceName}}"
    interfaces:
      Repository:
  github.com/cosmos/kms/gen/signerservice:
    config:
      include-auto-generated: true
      dir: "internal/tests/mocks"
      filename: "kms.go"
      pkgname: "mocks"
      structname: "Mock{{.InterfaceName}}"
    interfaces:
      SignerServiceClient:
