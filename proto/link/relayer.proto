syntax = "proto3";

package ibc.v2.relayer;

option go_package = "github.com/cosmos/ibc/link/api/v2/relayer";

service RelayerApiService {
  // Relay tracks the packets emitted by a source transaction and submits the
  // transactions required to complete them.
  rpc Relay(RelayRequest) returns (RelayResponse) {}

  // Status returns per-packet relay status for a transaction previously
  // submitted via Relay.
  //
  // Deprecated: use Packets with a filter of {source_chain_id, source_tx_hash},
  // which returns the same packets. Status will be removed.
  rpc Status(StatusRequest) returns (StatusResponse) {}

  // Packets lists the packets this relayer is aware of, most recent first.
  // It is a superset of Status: filtering on source_chain_id and
  // source_tx_hash returns exactly the packets Status returns for the same
  // transaction.
  rpc Packets(PacketsRequest) returns (PacketsResponse) {}
}

message RelayRequest {
  string tx_hash = 1;
  string source_chain_id = 2;
  // Selection is required and controls only this relayer instance; IBC
  // relaying remains permissionless.
  oneof selection {
    AllPackets all_packets = 3;
    SelectedPackets selected_packets = 4;
  }
}

// AllPackets selects every packet in the transaction for which this relayer
// has a configured client and route; packets without one are skipped, and the
// request succeeds even if that leaves nothing to relay.
message AllPackets {}

// SelectedPackets selects exactly the listed packets. The request fails if any
// packet is absent or not configured and routed. Packets already selected,
// in flight, or terminal are successful no-ops.
message SelectedPackets {
  repeated PacketSelector packets = 1;
}

message PacketSelector {
  string source_client_id = 1;
  uint64 sequence_number = 2;
}

message RelayResponse {}

message StatusRequest {
  string tx_hash = 1;
  string source_chain_id = 2;
}

message StatusResponse {
  repeated PacketStatus packet_statuses = 1;
}

message PacketsRequest {
  // Absent filter matches every packet.
  PacketFilter filter = 1;
  // Maximum packets to return. Zero applies the default of 100; values above
  // 1000 are capped.
  uint32 limit = 2;
  // Packets to skip, for paging. Results are ordered most recent first, so a
  // packet inserted between two pages can shift later pages; paging is not a
  // consistent snapshot.
  uint32 offset = 3;
}

// PacketFilter narrows the packets returned. Every field is optional and all
// present fields must match.
message PacketFilter {
  optional string source_chain_id = 1;
  optional string destination_chain_id = 2;
  optional string source_client_id = 3;
  optional string destination_client_id = 4;
  // Relay state as reported by this API, not the relayer's internal status.
  // A single state may cover several internal statuses; PACKET_STATE_PENDING
  // covers every in-flight status.
  optional PacketState state = 5;
  // The source-chain SendPacket transaction hash. Matches only the send
  // transaction, never a recv, ack, or timeout hash.
  optional string source_tx_hash = 6;
  optional uint64 sequence_number = 7;
  // Unix seconds, inclusive, matched against the packet's discovery time.
  optional int64 created_from = 8;
  optional int64 created_to = 9;
}

message PacketsResponse {
  repeated PacketStatus packets = 1;
  // Packets matching the filter, ignoring limit and offset.
  uint64 total = 2;
}

enum PacketState {
  PACKET_STATE_UNSPECIFIED = 0;
  // The packet was discovered but has not been selected by this relayer
  // instance. Another relayer may still deliver it.
  PACKET_STATE_NOT_SELECTED = 1;
  // The relayer is still processing the packet.
  PACKET_STATE_PENDING = 2;
  // The packet completed with a successful acknowledgement on the source
  // chain.
  PACKET_STATE_SUCCEEDED = 3;
  // The packet completed with a timeout refund on the source chain.
  PACKET_STATE_TIMED_OUT = 4;
  // The packet completed with an error acknowledgement on the source chain.
  PACKET_STATE_REJECTED = 5;
  // A permanent error prevents the relayer from processing the packet.
  PACKET_STATE_RELAY_FAILED = 6;
}

message TransactionInfo {
  string tx_hash = 1;
  string chain_id = 2;
}

message PacketStatus {
  PacketState state = 1;
  // Together with source_client_id, identifies the packet.
  uint64 sequence_number = 2;
  // Together with sequence_number, identifies the packet.
  string source_client_id = 3;
  // The source-chain SendPacket transaction. Always present.
  TransactionInfo send_tx = 4;
  // The destination-chain receive transaction, once submitted or discovered.
  TransactionInfo recv_tx = 5;
  // The source-chain acknowledgement transaction. Present for succeeded and
  // rejected packets, and may be present while pending.
  TransactionInfo ack_tx = 6;
  // The source-chain timeout transaction. Present for timed-out packets, and
  // may be present while pending.
  TransactionInfo timeout_tx = 7;
  // Unix seconds when the relayer first recorded the packet.
  int64 created_at = 8;
  // Unix seconds of the packet's last state change.
  int64 updated_at = 9;
}
