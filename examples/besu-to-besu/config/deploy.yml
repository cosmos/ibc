# SPDX-License-Identifier: Apache-2.0

# One-shot deployer, run as the `deployer` compose service (profile: tools).
# `ibc deploy core` puts the ICS26 router and access manager on each chain,
# which is what the attestors need before they can start.
#
# The deployer is the one key that cannot live in kms: `ibc deploy` needs the
# raw private key and rejects a remote signer outright —
# "deployer signer %q must be a local key (deployment tooling needs the raw key)".
#
# DEMO KEYS ONLY. ./setup.sh imports these from a public BIP-39 test vector.
db:
  type: sqlite
  url: ibc.db

chains:
  - chainId: "41001"
    evm:
      rpc: http://besu-a:8545
    deployer: deployer-a

  - chainId: "41002"
    evm:
      rpc: http://besu-b:8545
    deployer: deployer-b

signers:
  - alias: deployer-a
    type: local
    file: keys/deployer-a.json

  - alias: deployer-b
    type: local
    file: keys/deployer-b.json
