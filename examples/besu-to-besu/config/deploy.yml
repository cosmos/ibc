# SPDX-License-Identifier: Apache-2.0

server:
  listenAddr: 0.0.0.0:3000

db:
  type: sqlite
  url: ibc.db

chains:
  - chainId: "41001"
    evm:
      rpc: http://besu-a:8545
    deployer: deployer-a

  - chainId: "41002"
    evm:
      rpc: http://besu-b:8545
    deployer: deployer-b

signers:
  - alias: deployer-a
    type: local
    file: keys/deployer-a.json

  - alias: deployer-b
    type: local
    file: keys/deployer-b.json
