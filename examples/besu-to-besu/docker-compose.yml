# Two independent single-validator Besu QBFT chains.
#
# Each /evm mount points at chains/local/<chain>/, which ./setup.sh init
# renders from chains/*.tmpl — besu.toml, el-genesis.json, and the validator
# key derived from the demo mnemonic. Nothing under chains/local/ is committed,
# so `docker compose up` without a prior init has no config to mount.

services:

  # ── Chains ────────────────────────────────────────────────────────────────
  besu-a:
    image: ${BESU_IMAGE:-hyperledger/besu:25.4.0}
    container_name: besu-a
    command:
      - "--config-file=/evm/besu.toml"
      - "--metrics-enabled"
      - "--metrics-host=0.0.0.0"
      - "--metrics-port=9545"
      - "--Xqbft-enable-early-round-change"
    ports:
      - "8545:8545"
      - "8546:8546"
      - "9545:9545"
    volumes:
      - besu-a-data:/data
      - ./chains/local/A:/evm:ro
    networks: [ besu-besu-net ]
    restart: on-failure
    healthcheck:
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8545" ]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s

  besu-b:
    image: ${BESU_IMAGE:-hyperledger/besu:25.4.0}
    container_name: besu-b
    command:
      - "--config-file=/evm/besu.toml"
      - "--metrics-enabled"
      - "--metrics-host=0.0.0.0"
      - "--metrics-port=9545"
      - "--Xqbft-enable-early-round-change"
    ports:
      - "8745:8545"
      - "8746:8546"
      - "9745:9545"
    volumes:
      - besu-b-data:/data
      - ./chains/local/B:/evm:ro
    networks: [ besu-besu-net ]
    restart: on-failure
    healthcheck:
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8545" ]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s


volumes:
  besu-a-data:
  besu-b-data:

networks:
  besu-besu-net:
    driver: bridge
