# Two independent single-validator Besu QBFT chains.
#
# DEMO KEYS ONLY: the validator keys mounted at /evm are derived from publicly
# known BIP-39 test vectors. Local devnet use only — never on a public, shared,
# or production network.
#
# Each /evm mount points at chains/local/<chain>/, which ./setup.sh init
# renders from chains/*.tmpl — besu.toml, el-genesis.json, and the validator
# key derived from the demo mnemonic. Nothing under chains/local/ is committed,
# so `docker compose up` without a prior init has no config to mount.

services:

  # ── Chains ────────────────────────────────────────────────────────────────
  besu-a:
    image: ${BESU_IMAGE:-hyperledger/besu:25.4.0}
    container_name: besu-a
    command:
      - "--config-file=/evm/besu.toml"
      - "--metrics-enabled"
      - "--metrics-host=0.0.0.0"
      - "--metrics-port=9545"
      - "--Xqbft-enable-early-round-change"
    # Published on the loopback interface only. Without the explicit 127.0.0.1
    # these bind to 0.0.0.0 and expose an unauthenticated JSON-RPC endpoint —
    # holding keys that can sign as the chain's sole validator — to the whole
    # LAN. Container-to-container traffic goes over besu-besu-net and does not
    # depend on these mappings.
    ports:
      - "127.0.0.1:8545:8545"
      - "127.0.0.1:8546:8546"
      - "127.0.0.1:9545:9545"
    volumes:
      - besu-a-data:/data
      - ./chains/local/A:/evm:ro
    networks: [ besu-besu-net ]
    restart: on-failure
    healthcheck:
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8545" ]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s

  besu-b:
    image: ${BESU_IMAGE:-hyperledger/besu:25.4.0}
    container_name: besu-b
    command:
      - "--config-file=/evm/besu.toml"
      - "--metrics-enabled"
      - "--metrics-host=0.0.0.0"
      - "--metrics-port=9545"
      - "--Xqbft-enable-early-round-change"
    ports:                       # loopback only — see besu-a
      - "127.0.0.1:8745:8545"
      - "127.0.0.1:8746:8546"
      - "127.0.0.1:9745:9545"
    volumes:
      - besu-b-data:/data
      - ./chains/local/B:/evm:ro
    networks: [ besu-besu-net ]
    restart: on-failure
    healthcheck:
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8545" ]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s

  kms:
    image: ${KMS_IMAGE:-ghcr.io/cosmos/kms:latest}
    container_name: kms
    volumes:
      - ./config/kms.yaml:/home/kms/kms.yaml:ro
      - ./chains/local/kms/keys:/home/kms/keys:ro
    networks: [ besu-besu-net ]
    restart: on-failure
    healthcheck:
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9090" ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  attestor-41001: &attestor
    image: ${IBC_IMAGE:-ghcr.io/cosmos/ibc:main}
    container_name: attestor-41001
    command: [ "attestor", "run", "--home", "/home/ibc" ]
    env_file:
      - path: ./chains/local/ibc.env
        required: false
    volumes:
      - ./config/attestor-41001.yml:/home/ibc/ibc.yml:ro
    ports:
      - "127.0.0.1:3001:3000"
    networks: [ besu-besu-net ]
    restart: on-failure
    depends_on:
      besu-a:
        condition: service_healthy
      kms:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "/opt/ibc", "attestor", "info", "attestor-41001", "--home", "/home/ibc" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  attestor-41002:
    <<: *attestor
    container_name: attestor-41002
    volumes:
      - ./config/attestor-41002.yml:/home/ibc/ibc.yml:ro
    ports:
      - "127.0.0.1:3002:3000"
    depends_on:
      besu-b:
        condition: service_healthy
      kms:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "/opt/ibc", "attestor", "info", "attestor-41002", "--home", "/home/ibc" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  deployer:
    image: ${IBC_IMAGE:-ghcr.io/cosmos/ibc:main}
    user: "${DEPLOY_UID:-65532}:${DEPLOY_GID:-65532}"
    profiles: [ tools ]
    volumes:
      - ./config/deploy.yml:/home/ibc/ibc.yml:ro
      - ./chains/local/deploy/keys:/home/ibc/keys
      - ./chains/local/deploy/deployments:/home/ibc/deployments
    networks: [ besu-besu-net ]
    depends_on:
      besu-a:
        condition: service_healthy
      besu-b:
        condition: service_healthy


volumes:
  besu-a-data:
  besu-b-data:

networks:
  besu-besu-net:
    driver: bridge
