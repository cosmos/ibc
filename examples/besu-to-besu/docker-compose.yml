# SPDX-License-Identifier: Apache-2.0

# Two independent single-validator Besu QBFT chains.
#
# DEMO KEYS ONLY: the validator keys mounted at /evm are derived from publicly
# known BIP-39 test vectors. Local devnet use only — never on a public, shared,
# or production network.
#
#
#     kms  ◀── Sign ──┬── attestor-a ──┐
#                     ├── attestor-b ──┤ StateAttestation / PacketAttestation
#                     └── relayer  ◀───┘
x-ibc-service: &ibc-service
  image: ${IBC_IMAGE:-ghcr.io/cosmos/ibc:main}
  env_file:
    - path: ./chains/local/ibc.env
      required: false
  networks: [ besu-besu-net ]
  restart: on-failure

x-host-user: &host-user
  user: "${DEPLOY_UID:-65532}:${DEPLOY_GID:-65532}"

services:

  besu-a:
    <<: *host-user
    image: ${BESU_IMAGE:-hyperledger/besu:25.4.0}
    container_name: besu-a
    command:
      - "--config-file=/evm/besu.toml"
      - "--metrics-enabled"
      - "--metrics-host=0.0.0.0"
      - "--metrics-port=9545"
      - "--Xqbft-enable-early-round-change"
    ports:
      - "127.0.0.1:8545:8545"
      - "127.0.0.1:8546:8546"
      - "127.0.0.1:9545:9545"
    volumes:
      - ./chains/local/data/A:/data
      - ./chains/local/A:/evm:ro
    networks: [ besu-besu-net ]
    restart: on-failure
    healthcheck:
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8545" ]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s

  besu-b:
    <<: *host-user
    image: ${BESU_IMAGE:-hyperledger/besu:25.4.0}
    container_name: besu-b
    command:
      - "--config-file=/evm/besu.toml"
      - "--metrics-enabled"
      - "--metrics-host=0.0.0.0"
      - "--metrics-port=9545"
      - "--Xqbft-enable-early-round-change"
    ports:
      - "127.0.0.1:8745:8545"
      - "127.0.0.1:8746:8546"
      - "127.0.0.1:9745:9545"
    volumes:
      - ./chains/local/data/B:/data
      - ./chains/local/B:/evm:ro
    networks: [ besu-besu-net ]
    restart: on-failure
    healthcheck:
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8545" ]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s

  kms:
    image: ${KMS_IMAGE:-ghcr.io/cosmos/kms:latest}
    container_name: kms
    volumes:
      - ./config/kms.yaml:/home/kms/kms.yaml:ro
      - ./chains/local/kms/keys:/home/kms/keys:ro
    networks: [ besu-besu-net ]
    restart: on-failure
    healthcheck:
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9090" ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  attestor-a:
    <<: *ibc-service
    container_name: attestor-a
    command: [ "attestor", "run", "--home", "/home/ibc" ]
    volumes:
      - ./config/attestor-a.yml:/home/ibc/ibc.yml:ro
    ports:
      - "127.0.0.1:3010:3000"
    depends_on:
      besu-a:
        condition: service_healthy
      kms:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "/opt/ibc", "attestor", "info", "attestor-a", "--home", "/home/ibc" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  attestor-b:
    <<: *ibc-service
    container_name: attestor-b
    command: [ "attestor", "run", "--home", "/home/ibc" ]
    volumes:
      - ./config/attestor-b.yml:/home/ibc/ibc.yml:ro
    ports:
      - "127.0.0.1:3011:3000"
    depends_on:
      besu-b:
        condition: service_healthy
      kms:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "/opt/ibc", "attestor", "info", "attestor-b", "--home", "/home/ibc" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  deployer:
    <<: *host-user
    image: ${IBC_IMAGE:-ghcr.io/cosmos/ibc:main}
    profiles: [ tools ]
    volumes:
      - ./config/deploy.yml:/home/ibc/ibc.yml:ro
      - ./chains/local/deploy/keys:/home/ibc/keys
      - ./chains/local/deploy/deployments:/home/ibc/deployments
    networks: [ besu-besu-net ]
    depends_on:
      besu-a:
        condition: service_healthy
      besu-b:
        condition: service_healthy

  relayer:
    <<: [ *ibc-service, *host-user ]
    container_name: relayer
    command: [ "relayer", "run", "--home", "/home/ibc" ]
    volumes:
      - ./chains/local/relayer:/data
      - ./config/ibc.yml:/home/ibc/ibc.yml:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      attestor-a:
        condition: service_healthy
      attestor-b:
        condition: service_healthy

    healthcheck:
      test: [ "CMD", "nc", "-z", "127.0.0.1", "3000" ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s


networks:
  besu-besu-net:
    driver: bridge
